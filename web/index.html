<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyForge Mission Board</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<!-- Archivo for words, IBM Plex Mono for every number. Both come from the
     technical/industrial world rather than the usual UI-font shortlist, and
     the split is the rule that makes the whole board read as an instrument.
     Preconnect because these block first paint of the masthead. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ===================================================================
   SKYFORGE - air operations board
   Palette is derived from an unlit operations room and a sectional
   chart: cool graphite surfaces, chart blue for own forces, a
   desaturated chart red for hostile. Nothing here is decorative --
   if a colour appears, it means something.
   =================================================================== */
:root{
  /* surfaces, darkest to lightest */
  --graphite:#0A0E14;
  --slate:#111823;
  --panel:#161F2B;
  --raised:#1D2836;

  /* hairlines. --rule is structural, --rule-2 separates, --rule-hot is focus */
  --rule:#1E2836;
  --rule-2:#283444;
  --rule-hot:#3A5570;

  /* text */
  --ink:#E6EDF7;
  --ink-2:#94A5BC;
  --ink-3:#5E6E85;

  /* semantic. Blue = friendly/own, rose = hostile, amber = attention,
     jade = ready. Never used decoratively. */
  --blue:#4C8FE8;
  --blue-dim:#2C5A94;
  --rose:#D9455C;
  --amber:#E8A33D;
  --jade:#45C08A;
  --neutral:#7C8CA3;

  /* type */
  --ui:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  --r:3px;              /* small radius on purpose: zero everywhere is a tell */
  --hdrh:150px;

  /* Transitional aliases, removed as each view is rebuilt in later phases.
     Note what happens to the old category colours: violet, cyan and pink all
     collapse to neutral, because colour now means faction and nothing else.
     SEAD being violet and CSAR being pink told a pilot nothing. */
  --bg:var(--graphite);
  --panel2:var(--raised);
  --line:var(--rule);
  --fg:var(--ink);
  --dim:var(--ink-2);
  --dimmer:var(--ink-3);
  --red:var(--rose);
  --green:var(--jade);
  --violet:var(--ink-2);
  --cyan:var(--ink-2);
  --pink:var(--ink-2);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--graphite);color:var(--ink);
  font:400 13px/1.5 var(--ui);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--blue)}

/* Every number in this interface is mono and tabular. That single rule is
   what makes columns line up and readouts look like instruments. */
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Type roles. Mono for eyebrows is a chart/ops convention, not decoration. */
.eyebrow{font:500 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3)}

:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- masthead ---------- */
#hdr{position:fixed;top:0;left:0;right:0;z-index:1000;
  background:linear-gradient(180deg,var(--slate) 0%,rgba(17,24,35,.97) 100%);
  border-bottom:1px solid var(--rule)}

.masthead{display:flex;align-items:stretch;height:52px;
  border-bottom:1px solid var(--rule)}

.brand{display:flex;align-items:center;gap:11px;padding:0 18px;flex:none;
  border-right:1px solid var(--rule);text-decoration:none;color:inherit}
.brand svg{display:block;width:26px;height:26px;flex:none}
.wordmark{font:700 17px/1 var(--ui);letter-spacing:.11em;color:var(--ink)}
.brand .sub{font:500 8.5px/1 var(--mono);letter-spacing:.22em;color:var(--ink-3);
  border-left:1px solid var(--rule-2);padding-left:10px;margin-left:1px}

/* Theatre block: the one place a name and its metadata sit together. */
#theatre{display:flex;align-items:center;gap:12px;padding:0 18px;flex:none;
  border-right:1px solid var(--rule)}
#theatre .tname{font:600 13px/1.2 var(--ui);letter-spacing:.01em}
#theatre .tmeta{font:400 9.5px/1.2 var(--mono);letter-spacing:.13em;color:var(--ink-3);
  text-transform:uppercase}
#theatre .tally{display:flex;gap:1px;margin-left:2px}
#theatre .tally b{font:500 11px/1 var(--mono);padding:5px 8px;background:var(--panel);
  border:1px solid var(--rule-2)}
#theatre .tally b:first-child{border-radius:var(--r) 0 0 var(--r);color:var(--ink-2)}
#theatre .tally b:last-child{border-radius:0 var(--r) var(--r) 0;color:var(--amber)}

nav#views{display:flex;align-items:stretch;margin-left:auto}
nav#views .sb{position:relative;padding:0 20px;display:flex;align-items:center;
  font:500 11.5px/1 var(--ui);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);border-left:1px solid var(--rule);
  transition:color .16s ease,background .16s ease}
nav#views .sb:hover{color:var(--ink-2);background:rgba(76,143,232,.05)}
nav#views .sb.on{color:var(--ink);background:var(--panel)}
/* The active marker is a top rule, like a selected tab on a flight strip
   board -- not a pill, which is what every dashboard reaches for. */
nav#views .sb.on::before{content:'';position:absolute;left:0;right:0;top:-1px;
  height:2px;background:var(--blue)}

/* ---------- telemetry rail ---------- */
#rail{display:flex;align-items:center;gap:0;height:34px;overflow-x:auto;
  scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
#rail .cell{display:flex;align-items:center;gap:7px;padding:0 14px;height:100%;
  flex:none;border-right:1px solid var(--rule);white-space:nowrap}
#rail .cell .k{font:500 9px/1 var(--mono);letter-spacing:.16em;color:var(--ink-3);
  text-transform:uppercase}
#rail .cell .v{font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums;
  color:var(--ink)}
#rail .cell.state .v{font-weight:600;letter-spacing:.08em}
#rail .cell.on   .v{color:var(--jade)}
#rail .cell.off  .v{color:var(--rose)}
#rail .cell.blue .v{color:var(--blue)}
#rail .cell.rose .v{color:var(--rose)}
/* The instrument line: a single readout, the way weather is actually read. */
#rail .metar{font:400 11.5px/1 var(--mono);letter-spacing:.06em;color:var(--ink-2)}
#rail .metar b{color:var(--ink);font-weight:500}
#rail .grow{flex:1 1 auto;border-right:0}
#rail .addr{cursor:pointer}
#rail .addr:hover .v{color:var(--blue)}

/* live pulse: state, not decoration -- it ticks when data lands */
.beat{width:6px;height:6px;border-radius:50%;flex:none;background:var(--ink-3)}
.beat.on{background:var(--jade);box-shadow:0 0 0 0 rgba(69,192,138,.55);
  animation:beat 2.4s ease-out infinite}
.beat.off{background:var(--rose)}
@keyframes beat{
  0%{box-shadow:0 0 0 0 rgba(69,192,138,.5)}
  70%{box-shadow:0 0 0 7px rgba(69,192,138,0)}
  100%{box-shadow:0 0 0 0 rgba(69,192,138,0)}
}

/* ---------- filter bar (List view only) ---------- */
#filters{display:flex;align-items:center;gap:12px;height:38px;padding:0 18px;
  border-top:1px solid var(--rule);background:var(--graphite)}
#cats{display:flex;gap:6px;flex-wrap:wrap}
/* Category is a mono tag on a neutral chip. It deliberately carries no colour:
   colour is reserved for faction, so a red chip always means hostile. */
.fb{font:500 9.5px/1 var(--mono);letter-spacing:.13em;padding:5px 9px;
  border:1px solid var(--rule-2);border-radius:var(--r);color:var(--ink-3);
  background:transparent;transition:all .16s ease}
.fb:hover{color:var(--ink-2);border-color:var(--rule-hot)}
.fb.on{color:var(--ink);border-color:var(--blue);background:rgba(76,143,232,.1)}
#upd{margin-left:auto;font:400 10px/1 var(--mono);color:var(--ink-3);
  letter-spacing:.08em}

@media(max-width:1100px){
  .brand .sub{display:none}
  #theatre .tmeta{display:none}
  nav#views .sb{padding:0 13px;letter-spacing:.08em}
}
@media(max-width:760px){
  /* The nav needs its own row on a phone. Without flex-wrap it just ran off
     the right edge and the last two views were unreachable. */
  .masthead{height:auto;flex-wrap:wrap}
  .brand{padding:0 12px;gap:8px}
  .wordmark{font-size:14px;letter-spacing:.08em}
  #theatre{padding:0 12px}
  .brand{flex:1;min-width:0;height:46px}
  #theatre{height:46px;margin-left:auto;border-right:0}
  nav#views{width:100%;border-top:1px solid var(--rule);margin-left:0}
  nav#views .sb{flex:1;justify-content:center;padding:12px 4px;font-size:10px;
    letter-spacing:.06em;border-left:1px solid var(--rule)}
  nav#views .sb:first-child{border-left:0}

  /* On a phone the filter bar is the least valuable row: keep the chips,
     drop the label and the clock. */
  #filters{height:auto;padding:8px 12px;flex-wrap:wrap;gap:8px}
  #filters .eyebrow,#upd{display:none}
  #rail .cell{padding:0 11px}
}

/* ---------- body ---------- */
#main{position:absolute;inset:0;padding-top:var(--hdrh)}
#map{height:100%;background:#070a0e}

/* Two tasking columns. On a wide screen they sit side by side; the gutter is
   a hairline rather than whitespace so the board reads as one document. */
#list{height:100%;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;
  align-content:start}
#list .col{min-width:0;border-right:1px solid var(--rule)}
#list .col:last-child{border-right:0}

.colhead{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:10px;
  padding:11px 16px 10px;background:var(--graphite);
  border-bottom:1px solid var(--rule)}
.colhead h3{margin:0;font:600 11px/1 var(--ui);letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-2)}
.colhead .n{font:500 11px/1 var(--mono);color:var(--ink-3)}
.colhead .rule{flex:1;height:1px;background:var(--rule-2)}

/* ---------- tasking line ---------- */
.mc{position:relative;display:grid;
  grid-template-columns:44px 1fr auto;
  gap:0 12px;align-items:center;
  padding:9px 16px 9px 0;
  border-bottom:1px solid var(--rule);
  cursor:default;transition:background .14s ease}
.mc:hover{background:rgba(76,143,232,.045)}

/* The margin tape. Faction, always -- never mission type. */
.mc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--tape,var(--neutral));transition:width .14s ease}
.mc:hover::before{width:5px}
.mc.blue{--tape:var(--blue)}
.mc.red{--tape:var(--rose)}

/* Tasking number. The one place a big mono figure earns its size. */
.mc .tno{grid-column:1;grid-row:1/3;justify-self:end;
  font:500 15px/1 var(--mono);font-variant-numeric:tabular-nums;
  color:var(--ink-3);letter-spacing:-.02em}
.mc:hover .tno{color:var(--ink-2)}

.mc .mid{grid-column:2;grid-row:1;min-width:0}
.mc .top{display:flex;align-items:center;gap:8px;min-width:0}
.mc .obj{font:600 13.5px/1.25 var(--ui);color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .cat{font:500 9px/1 var(--mono);letter-spacing:.14em;padding:3px 6px;
  border:1px solid var(--rule-2);border-radius:2px;color:var(--ink-3);flex:none}
.mc .desc{font:400 11.5px/1.45 var(--ui);color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* Right-hand data block: fixed columns so the eye runs down, not across. */
.mc .right{grid-column:3;grid-row:1/3;display:flex;align-items:center;gap:16px;flex:none}
.mc .thr{display:flex;gap:2px;align-items:center}
.mc .thr i{width:3px;height:11px;background:var(--rule-2);border-radius:1px}
.mc .thr i.f{background:var(--amber)}
.mc .xp{font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums;
  color:var(--ink-2);min-width:52px;text-align:right}
.mc .aux{font:400 10px/1 var(--mono);color:var(--ink-3);min-width:56px;
  text-align:right}

/* Active tasking: progress is the point, so it becomes the baseline of the row. */
.mc.act .bar{grid-column:2/4;grid-row:2;height:2px;background:var(--rule);margin-top:7px;
  position:relative;overflow:hidden}
.mc.act .bar i{position:absolute;inset:0 auto 0 0;background:var(--blue)}
.mc.act.done .bar i{background:var(--jade)}
.mc .pct{font:500 11px/1 var(--mono);color:var(--ink-2);min-width:38px;text-align:right}
.mc.act.done .pct{color:var(--jade)}

/* Expiring work is the only thing allowed to use amber in this list. */
.mc.urgent .aux{color:var(--amber)}

.empty{padding:22px 16px;font:400 12px/1.5 var(--ui);color:var(--ink-3)}
/* First paint happens before any fetch resolves. An empty screen reads as
   broken, so say what is happening instead. */
.boot{padding:40px 20px;text-align:center;color:var(--ink-3);
  font:400 12px/1.7 var(--ui)}
.boot b{display:block;font:500 10px/1 var(--mono);letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.boot .bars{display:flex;gap:3px;justify-content:center;margin-bottom:14px}
.boot .bars i{width:3px;height:14px;background:var(--rule-2);
  animation:boot 1.1s ease-in-out infinite}
.boot .bars i:nth-child(2){animation-delay:.12s}
.boot .bars i:nth-child(3){animation-delay:.24s}
.boot .bars i:nth-child(4){animation-delay:.36s}
@keyframes boot{0%,100%{background:var(--rule-2)}50%{background:var(--blue)}}
.empty b{display:block;font:500 11px/1 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}

@media(max-width:1000px){
  #list{grid-template-columns:1fr}
  #list .col{border-right:0;border-bottom:1px solid var(--rule-2)}
}
@media(max-width:560px){
  .mc{grid-template-columns:34px 1fr;padding-right:12px}
  .mc .right{grid-row:2;grid-column:2;justify-content:flex-start;
    gap:12px;margin-top:5px}
  .mc.act .bar{grid-row:3}
  .mc .desc{white-space:normal}
}

/* --- pilot detail card --------------------------------------------------- */
.pgrid{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1400px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1000px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.pgrid{grid-template-columns:1fr}}

/* A standalone tile now, rather than something glued under a table row. */
.pgrid .pcard{position:relative;overflow:hidden;
  border:1px solid var(--line);border-radius:10px;
  background:var(--panel);display:flex;flex-direction:column}
.pgrid .pcard:hover{border-color:rgba(74,158,255,.35)}

/* Ordering is the one thing lost by dropping the numbered table, so make the
   podium readable at a glance instead. */
.pgrid .pcard.p1{border-color:rgba(255,200,72,.45)}
.pgrid .pcard.p2{border-color:rgba(190,200,215,.32)}
.pgrid .pcard.p3{border-color:rgba(205,127,50,.38)}
.prank{position:absolute;top:12px;right:14px;font:600 11px/1 ui-sans-serif,system-ui;
  color:var(--dimmer);letter-spacing:.06em}
.pcard.p1 .prank{color:#ffc848} .pcard.p2 .prank{color:#bec8d7}
.pcard.p3 .prank{color:#cd7f32}
.pgrid .pnote{flex:1}
/* Bottom-align the stat strip so a row of cards with different note lengths
   still lines its numbers up. */
.pgrid .pstats{margin-top:auto}
.pgrid .pname{padding-right:34px}

.pcard{border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;
  padding:18px 20px 0;margin:0 0 12px}
.phead{display:flex;gap:14px;align-items:flex-start}
.pav{width:56px;height:56px;border-radius:12px;flex:none;display:grid;
  place-items:center;font:700 19px/1 ui-sans-serif,system-ui;letter-spacing:.02em;
  background:var(--avb);color:var(--avf);border:1px solid var(--avf)}
.pname{font:600 17px/1.2 ui-sans-serif,system-ui;color:#ffc848;margin-bottom:7px}
.ppills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill2{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:3px 9px;font-size:11px;color:var(--dim)}
.pill2.b{border-color:rgba(74,158,255,.4);color:var(--blue)}
.pill2.r{border-color:rgba(255,77,77,.4);color:var(--red)}
.pnote{font-size:12.5px;color:var(--dim);line-height:1.75}
.pstats{display:flex;gap:0;margin:16px -20px 0;border-top:1px solid var(--line)}
.pstats>div{flex:1;min-width:0;padding:12px 8px;text-align:center;
  border-right:1px solid rgba(255,255,255,.05)}
.pstats>div:last-child{border-right:0}
.pstats b{display:block;font:600 17px/1.2 ui-sans-serif,system-ui;color:var(--fg);
  overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.pstats span{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--dimmer);margin-top:3px}

/* --- activity feed ------------------------------------------------------- */
.feed{margin-top:4px}
.fe{display:flex;gap:8px;align-items:baseline;padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,.045);line-height:1.35}
.fe:last-child{border-bottom:0}
.fe .ft{flex:none;font-size:10px;color:var(--dimmer);font-variant-numeric:tabular-nums}
.fe .fk{flex:none;font-size:9px;letter-spacing:.1em;padding:1px 5px;border-radius:4px;
  background:rgba(255,255,255,.06);color:var(--dim)}
.fe.kill .fk{background:rgba(255,77,77,.18);color:var(--red)}
.fe.capture .fk{background:rgba(74,158,255,.18);color:var(--blue)}
.fe.trap .fk{background:rgba(255,200,72,.18);color:#ffc848}
.fe.join .fk,.fe.leave .fk{background:rgba(74,222,128,.14);color:#4ade80}
.fe .fx{color:var(--fg)}
/* --- squadron totals ----------------------------------------------------- */
.tot2{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 18px}
.tot2 div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:8px 13px;min-width:88px}
.tot2 b{display:block;font:600 17px/1.2 ui-sans-serif,system-ui;
  font-variant-numeric:tabular-nums}
.tot2 span{display:block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dimmer);margin-top:3px}

/* Motion communicates state and nothing else. Anyone who has asked their
   system to stop animating gets a still interface, including the live pulse. */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  .beat.on{animation:none}
}

/* ===================== MAP HUD ===================== */
/* Corners only. The centre of the map is operational surface and stays clear. */
#hud{position:absolute;inset:var(--hdrh) 0 0 0;z-index:600;pointer-events:none;
  transition:right .18s ease;
  display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto;
  padding:12px;gap:8px}
#hud > *{pointer-events:auto}
/* When the workstation is open it owns the right edge; the HUD steps aside. */
#hud.panelled{right:326px}
@media(max-width:900px){#hud.panelled{right:0}}
#hud .tl{grid-area:1/1;justify-self:start;align-self:start}
#hud .tr{grid-area:1/3;justify-self:end;align-self:start}
#hud .bl{grid-area:3/1;justify-self:start;align-self:end}
#hud .br{grid-area:3/3;justify-self:end;align-self:end}
#hud .bc{grid-area:3/2;justify-self:center;align-self:end}

.hudbox{background:rgba(10,14,20,.86);border:1px solid var(--rule-2);
  border-radius:var(--r);backdrop-filter:blur(3px)}

/* top-left: what am I looking at */
.hud-theatre{display:flex;align-items:stretch}
.hud-theatre .t{padding:7px 11px;font:600 11px/1 var(--ui);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink);border-right:1px solid var(--rule-2)}
.hud-theatre .z{padding:7px 11px;font:500 11px/1 var(--mono);color:var(--ink-2)}

/* top-right: can I trust this picture */
.hud-tr{display:flex;gap:8px;align-items:flex-start}
.feedstate{display:flex;align-items:center;gap:7px;padding:7px 11px;
  font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.feedstate.live{color:var(--jade)} .feedstate.lag{color:var(--amber)}
.feedstate.dead{color:var(--rose)}

#intel{padding:7px 13px;font:600 10px/1 var(--mono);letter-spacing:.18em;
  color:var(--ink-3);background:rgba(10,14,20,.86);
  border:1px solid var(--rule-2);border-radius:var(--r);
  transition:color .16s ease,border-color .16s ease,background .16s ease}
#intel:hover{color:var(--ink-2);border-color:var(--rule-hot)}
#intel.on{color:var(--ink);border-color:var(--blue);background:rgba(76,143,232,.16)}

/* bottom-left: a map that does not tell you where the cursor is isn't a map */
.hud-pos{display:flex;align-items:stretch;font:500 11px/1 var(--mono)}
.hud-pos span{padding:7px 10px;color:var(--ink-2);

  font:500 9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;

  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}

  text-transform:uppercase;color:var(--ink-3);margin-top:5px}
#gci .pic .b b{color:var(--blue)} #gci .pic .r b{color:var(--rose)}
#gci .pic .n b{color:var(--ink-2)}

#gci .dot{width:6px;height:6px;border-radius:50%;display:inline-block;
  margin-right:7px;vertical-align:1px}


/* ===================== PANEL VIEWS ===================== */
#panel{height:100%;overflow-y:auto}
.pnl{max-width:1280px;margin:0 auto;padding:26px 26px 60px}
.pnl.wide{max-width:1500px}

.tot2 b{display:block;font:600 20px/1 var(--mono);font-variant-numeric:tabular-nums;

<body>

<header id="hdr">
  <div class="masthead">

      <!-- Delta planform inside a chevron: reads as an aircraft and as a rank

  </div>
</header>

<div id="main">
  <div id="list"><div class="boot">
    <div class="bars"><i></i><i></i><i></i><i></i></div>
    <b>Contacting SkyForge</b>
    Reading campaign state, roster and the live picture.
  </div></div>
  <div id="map" style="display:none"></div>
  <div id="panel" style="display:none"></div>
  <div id="hud" style="display:none" aria-hidden="true">
    <div class="tl hudbox hud-theatre">
      <span class="t" id="hudTheatre">Caucasus</span>
      <span class="z" id="hudZones">--</span>
    </div>
    <div class="tr hud-tr">
      <div class="hudbox feedstate" id="feedState"><span class="beat"></span><span>--</span></div>
      <button id="intel" title="Contact labels and the controller panel"
              aria-pressed="false">INTEL</button>
    </div>
    <div class="bl hudbox hud-pos">
      <span id="hudLL">--.----  --.----</span><span id="hudZ">z--</span>
    </div>
    <div class="bc" id="mapnote"></div>
    <div class="br hudbox hud-legend">
      <div><i style="background:var(--blue)"></i>Friendly</div>
      <div><i style="background:var(--rose)"></i>Hostile</div>
      <div><i class="sq" style="background:var(--amber)"></i>Awaiting pickup</div>
      <div><i class="ring" style="color:var(--ink-2)"></i>Contested zone</div>
    </div>
  </div>
  <div id="gci" style="display:none"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
// ---------------------------------------------------------------------------
// SkyForge Mission Board.
//
// Static JSON from CloudFront, no API server. The DCS box publishes while it
// runs; when it sleeps the files stop changing, so every panel is driven from
// status.json's timestamp rather than assuming data means "live".
//
// Mission cards are derived from Pretense's own state: zones building a mission
// (currentMissionBuild) are ACTIVE, zones that could be pushed are AVAILABLE,
// and downed pilots in csarTracker become rescue tasks.
// ---------------------------------------------------------------------------
const DATA = './data/', POLL = 10000, STALE = 150;
const SIDE = {0:'#8b96a8', 1:'#ff4d4d', 2:'#4a9eff'};
const CATS = ['patrol','cas','sead','strike','assault','supply','csar'];

// Squadron appointments. Keyed by the exact DCS player name -- matched
// case-insensitively, because people re-type their name and capitalisation
// drifts. Add a line to give someone a title; nothing else needs changing.
//
// OVERLORD is the traditional NATO callsign for ground-based intercept
// control, which is the job rather than a nickname.
const ROLES = {
  'r00k': {tag:'OVERLORD', title:'Ground Control Intercept \u00b7 runs the radar picture and vectors the flight'},
};
const roleOf = n => ROLES[String(n||'').trim().toLowerCase()] || null;

// Deterministic avatar colour per pilot, so the same person is always the same
// colour without storing anything.
function avatar(name){
  let h=0; const t=String(name||'?');
  for(let i=0;i<t.length;i++) h=(h*31 + t.charCodeAt(i))|0;
  const hue=Math.abs(h)%360;
  // The word-initials approach only understands Latin; a Cyrillic name like
  // Терминатор stripped to nothing and rendered as '?'. Fall back to the first
  // two characters of the raw name before giving up.
  const initials=t.replace(/[^A-Za-z0-9]+/g,' ').trim().split(/\s+/)
    .slice(0,2).map(w=>w[0]).join('').toUpperCase()
    || t.trim().slice(0,2).toUpperCase() || '?';
  return {initials, bg:`hsl(${hue} 45% 16%)`, fg:`hsl(${hue} 70% 62%)`};
}
let view = 'list', active = new Set(CATS);

// Controller mode: contact labels + the intel panel. Remembered per browser so
// whoever runs GCI does not re-enable it every visit. Storage can throw
// outright in a private window, so never let it stop the page rendering.
let intel = (() => { try { return localStorage.getItem('sf-intel') === '1'; }
                     catch(e) { return false; } })();
let D = {status:null, campaign:null, live:null, pilots:null, history:null, zones:null,
         seen:null, combat:null, kd:null, feed:null};

const $ = s => document.querySelector(s);
// Pilot names are attacker-controlled text rendered into innerHTML. Escape.
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c;
  if(h!==undefined)e.innerHTML=h; return e; };

// --- map -------------------------------------------------------------------
const map = L.map('map',{zoomControl:true,preferCanvas:true}).setView([42.6,42.0],7);

// Cursor position and zoom, the way any real chart tool reports them. Written
// straight to textContent on mousemove -- no re-render, no layout thrash.
if(map.on){
  const fmt = (v,pos,neg) => `${Math.abs(v).toFixed(4)}\u00b0${v>=0?pos:neg}`;
  map.on('mousemove', e => {
    const n = $('#hudLL');
    if(n) n.textContent = `${fmt(e.latlng.lat,'N','S')}  ${fmt(e.latlng.lng,'E','W')}`;
  });
  const zoomOut = () => { const n=$('#hudZ'); if(n) n.textContent = 'z'+map.getZoom(); };
  map.on('zoomend', zoomOut); map.on('load', zoomOut);
}
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OSM &copy; CARTO',subdomains:'abcd',maxZoom:18}).addTo(map);
const gZones=L.layerGroup().addTo(map), gUnits=L.layerGroup().addTo(map),
      gTrk=L.layerGroup().addTo(map);
let mapReady=false;

// Affine transform from DCS metres to lat/lon, solved from the reference points
// the export hook publishes. Pretense stores raw metres, so without this its
// zones and downed pilots cannot be placed at all.
// DCS metres -> lat/lon, exact inverse transverse Mercator.
//
// The constants come from the terrain itself (pydcs generates them from DCS)
// and ride along in zones.json, so this needs no reference points and no live
// server. Validated against six Caucasus airfields: worst error 0.75 km, best
// 0.03 km -- and those residuals are zone-centre vs airport reference point,
// not projection error.
//
// DCS axis order is the trap: mission x is NORTHING, z is EASTING. Swapping
// them mirrors the map into the Black Sea.
const WGS_A = 6378137.0, WGS_F = 1/298.257223563;
const WGS_E2 = WGS_F*(2-WGS_F), WGS_EP2 = WGS_E2/(1-WGS_E2);

function dcsLL(x, z){
  const p = D.zones && D.zones.proj;
  if(!p || !isFinite(x) || !isFinite(z)) return null;

  const E = z - p.x0, N = x - p.y0, k0 = p.k0;
  const e1 = (1-Math.sqrt(1-WGS_E2))/(1+Math.sqrt(1-WGS_E2));
  const mu = (N/k0)/(WGS_A*(1 - WGS_E2/4 - 3*WGS_E2**2/64 - 5*WGS_E2**3/256));

  const phi1 = mu
    + (3*e1/2 - 27*e1**3/32)*Math.sin(2*mu)
    + (21*e1**2/16 - 55*e1**4/32)*Math.sin(4*mu)
    + (151*e1**3/96)*Math.sin(6*mu)
    + (1097*e1**4/512)*Math.sin(8*mu);

  const sp = Math.sin(phi1), cp = Math.cos(phi1), tp = Math.tan(phi1);
  const C1 = WGS_EP2*cp*cp, T1 = tp*tp;
  const N1 = WGS_A/Math.sqrt(1 - WGS_E2*sp*sp);
  const R1 = WGS_A*(1-WGS_E2)/Math.pow(1 - WGS_E2*sp*sp, 1.5);
  const d = E/(N1*k0), d2 = d*d, d4 = d2*d2, d6 = d4*d2;

  const lat = phi1 - (N1*tp/R1)*(d2/2
    - (5 + 3*T1 + 10*C1 - 4*C1*C1 - 9*WGS_EP2)*d4/24
    + (61 + 90*T1 + 298*C1 + 45*T1*T1 - 252*WGS_EP2 - 3*C1*C1)*d6/720);
  const lon = p.lon0*Math.PI/180 + (d
    - (1 + 2*T1 + C1)*d*d2/6
    + (5 - 2*C1 + 28*T1 - 3*C1*C1 + 8*WGS_EP2 + 24*T1*T1)*d*d4/120)/cp;

  const out = [lat*180/Math.PI, lon*180/Math.PI];
  return (isFinite(out[0]) && isFinite(out[1])) ? out : null;
}

// Pretense stores {x, y, z} with y as altitude.
const toLL = p => !p ? null : dcsLL(p.x, p.z);

// --- helpers ---------------------------------------------------------------
const ago = s => s<60?`${Math.round(s)}s`:s<3600?`${Math.round(s/60)}m`:
  s<86400?`${Math.round(s/3600)}h`:`${Math.round(s/86400)}d`;
const mmss = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const grab = async n => { try{ const r=await fetch(DATA+n,{cache:'no-store'});
  return r.ok? await r.json():null; }catch{ return null; } };

function catOf(name){
  const s=(name||'').toLowerCase();
  for(const c of ['cas','sead','strike','assault','supply','patrol']) if(s.includes(c)) return c;
  return 'patrol';
}
// Hours read better than minutes once someone has a few sessions in.
const flown = m => !m ? null : m < 90
  ? `${Math.round(m)} min` : `${(m/60).toFixed(1)} h`;

const stars = n => '★'.repeat(n)+'<span style="color:#333">'+'★'.repeat(4-n)+'</span>';

// --- derive missions from Pretense state -----------------------------------
function missions(){
  const c=D.campaign; if(!c) return {avail:[],act:[]};
  const avail=[], act=[];

  Object.values(c.zones||{}).forEach(z=>{
    if(z.currentMissionBuild){
      const m=z.currentMissionBuild;
      act.push({id:m.name, cat:catOf(m.name), zone:z.name, side:m.side,
        desc:`Building ${m.name.replace(/-/g,' ')} at ${z.name}`,
        prog:Math.min(100,m.progress), diff:2, xp:Math.round(m.progress*8)});
    }
    // A contested blue-adjacent zone is something players can actually act on.
    if(z.distToFront<=2 && z.side!==0){
      avail.push({id:z.name.toLowerCase(), cat: z.side===1?'strike':'patrol',
        zone:z.name, side:z.side,
        desc: z.side===1 ? `Capture ${z.name} — ${z.distToFront} zones from the front`
                         : `Defend ${z.name} — enemy ${Math.round(z.closestEnemyDist/1000)} km out`,
        diff: Math.max(1,Math.min(4,5-z.distToFront)),
        xp: 200+Math.round((z.resource||0)/200), res:z.resource});
    }
  });

  Object.values(c.csarTracker||{}).forEach(p=>{
    avail.push({id:p.name, cat:'csar', zone:'downed pilot', side:2,
      desc:`Rescue ${p.name} and return them to a friendly zone`,
      diff:3, xp:500, timer:p.remainingTime, pos:p.pos});
  });

  // Ground squads waiting for a lift. These only became flyable work when the
  // Hercules and UH-60 went on the server, and Pretense already tracks them
  // with a countdown.
  Object.values(c.squadTracker||{}).forEach(q=>{
    if(q.state!=='extractReady') return;
    avail.push({id:q.name, cat:'supply', zone:'field extraction', side:q.side||2,
      desc:`Extract ${q.type||'squad'} team ${q.name} — needs a transport`,
      diff:2, xp:300, timer:q.remainingStateTime, pos:q.position});
  });

  return {avail, act};
}

// --- render ----------------------------------------------------------------
function card(m, isActive, lineNo){
  const c=el('div','mc '+(m.side===1?'red':m.side===2?'blue':'')+(isActive?' act':''));
  const pct = isActive ? Math.max(0,Math.min(100,m.prog||0)) : 0;
  if(isActive && pct>=100) c.classList.add('done');

  // Threat as four ticks rather than stars: stars read as a rating, and this
  // is a threat assessment. Filled ticks are amber because threat is the one
  // thing in this list that warrants attention colour.
  const thr=[0,1,2,3].map(i=>`<i class="${i<(m.diff||0)?'f':''}"></i>`).join('');

  // Right-hand block, fixed order so it lines up down the column.
  const aux = m.timer ? `<span class="aux">${mmss(m.timer)}</span>`
            : m.res   ? `<span class="aux">${Math.round(m.res/1000)}k res</span>`
            : '<span class="aux"></span>';
  if(m.timer && m.timer < 600) c.classList.add('urgent');

  c.innerHTML=`
    <span class="tno">${String(lineNo).padStart(3,'0')}</span>
    <div class="mid">
      <div class="top">
        <span class="cat">${esc(m.cat.toUpperCase())}</span>
        <span class="obj">${esc(m.zone)}</span>
      </div>
      <div class="desc">${esc(m.desc)}</div>
    </div>
    <div class="right">
      <span class="thr" title="Threat ${m.diff||0} of 4">${thr}</span>
      <span class="xp">+${m.xp} XP</span>
      ${isActive ? `<span class="pct">${pct.toFixed(0)}%</span>` : aux}
    </div>
    ${isActive ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}`;
  return c;
}

function renderList(){
  const {avail,act}=missions();
  const a=avail.filter(m=>active.has(m.cat)), b=act.filter(m=>active.has(m.cat));
  const L=$('#list'); L.innerHTML='';

  const mk=(title,arr,isAct,emptyMsg)=>{
    const col=el('div','col');
    const h=el('div','colhead');
    h.innerHTML=`<h3>${title}</h3><span class="n">${String(arr.length).padStart(2,'0')}</span>
                 <span class="rule"></span>`;
    col.appendChild(h);
    if(!arr.length){
      // An empty column should say what would fill it, not just sit blank.
      col.appendChild(el('div','empty',
        `<b>No ${title.toLowerCase()} tasking</b>${emptyMsg}`));
    }
    arr.forEach((m,i)=>col.appendChild(card(m,isAct,i+1)));
    return col;
  };

  L.appendChild(mk('Available',a,false,
    active.size<CATS.length ? 'Some categories are filtered out.'
                            : 'Pretense generates tasking as the front moves.'));
  L.appendChild(mk('Active',b,true,
    'Nothing is being built right now.'));
}

function renderMap(gci){
  gZones.clearLayers(); gUnits.clearLayers(); gTrk.clearLayers();
  const live=D.live, c=D.campaign;
  const bases=(live&&live.world&&live.world.bases)||[];
  const byName={}; bases.forEach(b=>byName[b.n.toLowerCase()]=b);

  // Zone positions, in order of trust:
  //   1. the live airbase, when gRPC is running and the names match
  //   2. zones.json, derived offline from the mission's own trigger zones
  //
  // (2) is why the map works at all with the server asleep, and why zones that
  // are not airbases -- Alpha, Oil Fields, Distillery -- can be drawn.
  const zpos=(D.zones&&D.zones.zones)||{};
  const placed=[];

  if(c) Object.values(c.zones||{}).forEach(z=>{
    const b=byName[(z.name||'').toLowerCase()];
    const fallback=zpos[z.name];
    const ll = b ? [b.lat,b.lon] : (Array.isArray(fallback)?fallback:null);
    if(!ll) return;
    placed.push(ll);
    L.circleMarker(ll,{radius:z.distToFront<=1?9:6,color:SIDE[z.side],weight:2,
      fillColor:SIDE[z.side],fillOpacity:.35})
      .bindPopup(`<b>${z.name}</b><br>${z.side===2?'BLUE':z.side===1?'RED':'neutral'}<br>
        resources ${Math.round((z.resource||0)/1000)}k · ${z.distToFront} from front`)
      .addTo(gZones);
  });

  // Contested zones (distToFront <= 1) get a halo, so the front reads at a
  // glance instead of having to compare 61 dot colours.
  if(c) Object.values(c.zones||{}).forEach(z=>{
    if((z.distToFront??9) > 1) return;
    const b=byName[(z.name||'').toLowerCase()];
    const fb=zpos[z.name];
    const ll = b ? [b.lat,b.lon] : (Array.isArray(fb)?fb:null);
    if(!ll) return;
    L.circleMarker(ll,{radius:15,color:SIDE[z.side],weight:1,opacity:.35,
      fill:false,dashArray:'3 4'}).addTo(gZones);
  });

  if(c) Object.values(c.csarTracker||{}).forEach(p=>{
    const ll=toLL(p.pos); if(!ll) return;
    L.circleMarker(ll,{radius:7,color:'#3fd07a',weight:2,fillOpacity:.5})
      .bindPopup(`<b>${p.name}</b><br>downed pilot · ${mmss(p.remainingTime)} left`).addTo(gZones);
  });

  // Everything below comes from the campaign save, so the map is populated
  // whether or not DCS-gRPC is running. Positions are up to ~60s old --
  // Pretense's save interval -- which the footer says out loud.
  const AIR = {tanker:'TKR', awacs:'AWACS', strike:'STRIKE', cap:'CAP',
               patrol:'CAP', supply_air:'SUPPLY', assault:'ASSAULT',
               transport:'TRANSPORT', csar:'CSAR'};

  Object.values((c&&c.activeGroups)||{}).forEach(g=>{
    const ll=toLL(g.position); if(!ll) return;
    const side = /-blue(-|$)/.test(g.productName||'') ? 2
               : /-red(-|$)/.test(g.productName||'') ? 1 : 0;
    const air = (g.position.y||0) > 150;
    const label = AIR[g.type] || (g.type||'').toUpperCase().slice(0,8);
    L.circleMarker(ll,{radius:air?5:4,color:SIDE[side],weight:air?2:1,
      fillColor:SIDE[side],fillOpacity:air?.85:.4})
      .bindPopup(`<b>${esc(label)}</b><br>${esc(g.productName||'')}<br>
        ${esc(g.homeName||'?')} &rarr; ${esc(g.targetName||'?')}<br>
        ${air?Math.round(g.position.y)+' m':'on the ground'}`)
      .addTo(gUnits);
    if(gci && air){
      L.marker(ll,{icon:L.divIcon({className:'',iconAnchor:[-7,6],
        html:`<div class="trk" style="color:${SIDE[side]}">${esc(label)}<br>FL${
          String(Math.round(g.position.y*3.28/100)).padStart(3,'0')}</div>`})})
        .addTo(gTrk);
    }
  });

  // Ground squads: the ones marked extractReady are a job for a transport.
  Object.values((c&&c.squadTracker)||{}).forEach(q=>{
    const ll=toLL(q.position); if(!ll) return;
    const ready = q.state==='extractReady';
    L.circleMarker(ll,{radius:ready?7:4,color:ready?'#ffc848':SIDE[q.side||0],
      weight:ready?2:1,fillOpacity:ready?.6:.25})
      .bindPopup(`<b>${esc(q.type||'squad')}</b> ${esc(q.name)}<br>
        ${esc(q.state||'')}<br>${mmss(q.remainingStateTime||0)} left`)
      .addTo(gZones);
  });

  Object.values((c&&c.carriers)||{}).forEach(cv=>{
    const ll = toLL(cv.position && cv.position.p); if(!ll) return;
    L.circleMarker(ll,{radius:8,color:'#4a9eff',weight:2,fillColor:'#0b1520',
      fillOpacity:.9})
      .bindPopup(`<b>${esc(cv.name)}</b><br>${(cv.aliveGroupMembers||[]).length} hull(s)<br>
        ${Math.round((cv.resource||0)/1000)}k resources`)
      .addTo(gZones);
  });

  const units=(live&&live.world&&live.world.units)||[];
  units.forEach(u=>{
    const col=SIDE[u.c]||SIDE[0], isP=!!u.p;
    L.circleMarker([u.lat,u.lon],{radius:isP?6:3,color:isP?'#ffb020':col,
      weight:isP?2:1,fillColor:col,fillOpacity:.8})
      .bindPopup(`<b>${isP?u.p:u.t}</b><br>${u.t}<br>${u.alt} m`).addTo(gUnits);
    if(gci&&u.cat<=1){
      L.marker([u.lat,u.lon],{icon:L.divIcon({className:'',iconAnchor:[-7,6],
        html:`<div class="trk" style="color:${col}">${isP?u.p:u.t}<br>FL${String(Math.round(u.alt*3.28/100)).padStart(3,'0')}</div>`})})
        .addTo(gTrk);
    }
  });

  if(!mapReady){
    const pts=[...placed,...bases.map(b=>[b.lat,b.lon]),...units.map(u=>[u.lat,u.lon])];
    if(pts.length){
      // Reserve room for the intel panel, or the eastern zones sit underneath it.
      map.fitBounds(L.latLngBounds(pts).pad(.15),
        gci ? {paddingBottomRight:[320,0]} : undefined);
      mapReady=true;
    }
  }
}

// The GCI view is a controller's station, not just a map with labels: what is
// contested, who is airborne, who needs picking up. All of it comes from the
// campaign save, so it works with the server asleep.
// The event feed is the only thing on this board that is genuinely real-time:
// it comes from a persistent gRPC stream, not a 15s poll of a save file.
function feedRows(n){
  const f = (D.feed && D.feed.feed) || [];
  if(!f.length) return '<div class="none">nothing yet this session</div>';
  return f.slice(0, n).map(e=>`<div class="fe ${esc(e.k)}">
    <span class="ft">${ago(Date.now()/1000 - e.ts)}</span>
    <span class="fk">${esc(String(e.k).toUpperCase())}</span>
    <span class="fx">${esc(e.t)}</span></div>`).join('');
}

// The HUD corners. Kept separate from mapNote() so the trust indicator can
// update on every poll without touching the source line.
function renderHud(){
  const z = Object.keys((D.zones&&D.zones.zones)||{}).length;
  const c = D.campaign, zs = Object.values((c&&c.zones)||{});
  const t = $('#hudTheatre'); if(t) t.textContent = (D.zones&&D.zones.theatre)||'Caucasus';
  const zz = $('#hudZones');
  if(zz) zz.textContent = zs.length ? `${zs.length} zones \u00b7 ${z} mapped` : `${z} mapped`;

  // Three states, because "live" and "a minute old" are different promises.
  // Player positions are real-time via gRPC; AI positions come from the
  // campaign save and are up to a minute behind. Saying so is the point.
  const st = D.status, age = st ? Date.now()/1000 - st.ts : 1e9;
  const on = st && st.online && age < STALE;
  const fs = $('#feedState');
  if(fs){
    const cls = !on ? 'dead' : age > 60 ? 'lag' : 'live';
    const txt = !on ? 'No feed' : age > 60 ? `Lagging ${ago(age)}` : 'Live';
    fs.className = `hudbox feedstate ${cls}`;
    fs.innerHTML = `<span class="beat ${on?'on':'off'}"></span><span>${txt}</span>`;
  }
}

// A map should say what it is showing, rather than leaving gaps to be guessed at.
function mapNote(){
  const st=D.status, age=st?Date.now()/1000-st.ts:1e9;
  const on=st&&st.online&&age<STALE;
  const zn=Object.keys((D.zones&&D.zones.zones)||{}).length;
  const players=((D.live&&D.live.world&&D.live.world.units)||[]).length;
  const ai=Object.values((D.campaign&&D.campaign.activeGroups)||{})
    .filter(g=>(g.position&&g.position.y||0)>150).length;

  const bits=[];
  if(!zn){ bits.push('Zone positions unavailable'); }
  else {
    bits.push(`${zn} zones mapped`);
    // Say where each number comes from and how old it is. A map that implies
    // live tracking when it is a minute behind is worse than no map.
    if(ai) bits.push(`${ai} AI contacts from the campaign feed (~1 min old)`);
    if(players) bits.push(`${players} player aircraft, live`);
    else if(on) bits.push('player positions need DCS-gRPC');
    if(!on) bits.push('server offline \u2014 last known picture');
  }
  const el=$('#mapnote'); if(el) el.textContent=bits.join('  \u00b7  ');
}

// Weather as a pilot actually reads it: one instrument line, not four widgets.
//
//   230908Z 18000KT 17C Q1001
//
// Wind is converted to knots because that is the unit on every kneeboard and
// every ATIS; DCS reports metres per second. Calm renders 00000KT, which is
// the real notation -- a pilot reads that instantly and it beats inventing a
// word for it. Values DCS does not supply are omitted rather than zeroed: a
// blank temperature shown as 0C is a lie, and this is flight data.
function envChips(){
  const e = D.live && D.live.env;
  if(!e) return '';

  const p2 = n => String(n).padStart(2,'0');
  const p3 = n => String(n).padStart(3,'0');
  const bits = [];

  // Day-of-month + mission time, Zulu. The Z is not decoration -- mission time
  // is what briefings are written against, and it is not the wall clock.
  if(e.day) bits.push(`<b>${p2(e.day)}${p2(e.hh??0)}${p2(e.mm??0)}Z</b>`);
  else      bits.push(`<b>${p2(e.hh??0)}${p2(e.mm??0)}Z</b>`);

  const kt = Math.round((e.windMs||0) * 1.94384);
  bits.push(`<b>${p3(e.windDir||0)}${p2(kt)}KT</b>`);

  if(e.tempC !== null && e.tempC !== undefined) bits.push(`<b>${Math.round(e.tempC)}C</b>`);
  if(e.qnh) bits.push(`<b>Q${e.qnh}</b>`);

  return `<div class="cell metar" title="Mission time (Zulu), surface wind, temperature, QNH">
    ${bits.join(' ')}</div>`;
}

function renderHeader(){

  const age=s?Date.now()/1000-s.ts:1e9, on=s&&s.online&&age<STALE;

  const blue=zones.filter(z=>z.side===2).length, red=zones.filter(z=>z.side===1).length;

  // Theatre: the campaign's identity, with the two counts a pilot scans for.
  $('#theatre').innerHTML=`
    <div>
      <div class="tname">${esc((D.zones&&D.zones.theatre)||'Caucasus')}</div>
      <div class="tmeta">Pretense &middot; persistent</div>
    </div>
    <div class="tally" title="${avail.length} available, ${act.length} active">
      <b>${avail.length}</b><b>${act.length}</b>
    </div>`;

  // Telemetry rail. Ordered by what needs answering first: is it up, who is on,
  // is it healthy, who holds what, what is the weather, where do I connect.
  const cell=(cls,k,v,extra='')=>
    `<div class="cell ${cls}" ${extra}><span class="k">${k}</span><span class="v">${v}</span></div>`;

  $('#rail').innerHTML=`
    <div class="cell state ${on?'on':'off'}">
      <span class="beat ${on?'on':'off'}"></span>
      <span class="v">${on?'ON STATION':'OFFLINE'}</span>
      ${on?'':`<span class="k">${ago(age)} ago</span>`}
    </div>
    ${cell('','Pilots', on?(s.players||0):0)}
    ${cell('','Sim', on?`${s.fps}<span class="k" style="margin-left:4px">fps</span>`:'--')}
    ${cell('blue','Blue', blue)}
    ${cell('rose','Red', red)}
    ${envChips()}
    <div class="cell grow"></div>
    ${cell('addr','Server', s?esc(s.address):'--','id="cp" title="Copy address"')}`;

  const cp=$('#cp');
  if(cp&&s) cp.onclick=()=>{
    navigator.clipboard.writeText(s.address);
    const v=cp.querySelector('.v'), t=v.textContent;
    v.textContent='COPIED'; setTimeout(()=>{v.textContent=t;},1100);
  };
}

// The floating header is not a fixed height. It grows with content (mission
// tabs, status chips) and with viewport width, because #ctl is flex-wrap:wrap
// -- adding the Pilots/History/Files buttons made it wrap one row sooner on a
// narrow window. #main clears the header with padding, so that number cannot
// be a constant: when it was, panels slid underneath it.
function syncHeaderHeight(){
  const el = $('#hdr');
  if(!el || typeof el.getBoundingClientRect !== 'function') return;
  const root = document.documentElement;
  if(!root || !root.style || !root.style.setProperty) return;
  // 12px because #hdr is inset from the top, plus 12px of breathing room.
  const h = Math.ceil(el.getBoundingClientRect().height) + 24;
  if(h > 0) root.style.setProperty('--hdrh', h + 'px');
}

function renderCats(){
  $('#cats').innerHTML=CATS.map(c=>
    `<button class="fb ${active.has(c)?'on':''}" data-c="${c}">${c.toUpperCase()}</button>`).join('');
  $('#cats').querySelectorAll('.fb').forEach(b=>b.onclick=()=>{
    const c=b.dataset.c; active.has(c)?active.delete(c):active.add(c);
    renderCats(); draw();
  });
}

// --- Pilots -----------------------------------------------------------------
//
// Pretense's player_stats.json is Lua-shaped, so two things bite here: a
// player with no stats yet serialises as an empty ARRAY rather than an object,
// and the online roster uses DCS display names that must be matched against
// these keys exactly.

function pilotRows(){
  const st=(D.pilots&&D.pilots.stats)||{};
  const online=new Set(((D.status&&D.status.names)||[]).map(n=>
    typeof n==='object'?n.n:n));
  return Object.entries(st).map(([name,v])=>{
    const o = (v && typeof v==='object' && !Array.isArray(v)) ? v : {};
    const live=((D.status&&D.status.names)||[]).find(x=>
      (typeof x==='object'?x.n:x)===name);
    const slot=(((D.pilots&&D.pilots.players)||[]).find(p=>p.name===name)||{}).unit;
    return {name, xp:+o.XP||0, cmd:+o.CMD||0, sb:+o.SB||0, on:online.has(name),
            role:roleOf(name), side:live&&typeof live==='object'?+live.s||0:0,
            unit:slot||null, cfg:((D.pilots&&D.pilots.config)||{})[name]||null,
            cb:((D.combat&&D.combat.pilots)||{})[name]||null,
            kd:((D.kd&&D.kd.pilots)||{})[name]||null};
  }).sort((a,b)=>b.xp-a.xp);
}

// Only tiles backed by real data are emitted. Pretense records XP, a 'cmd'
// counter and a survival bonus -- it does not record kills or deaths, so there
// are no such tiles until something actually produces those numbers.
// Squadron-wide aggregates. Every figure is summed from data that exists --
// nothing is shown that would be zero purely because the source is missing.
function squadronTotals(rows){
  const sum = (f) => rows.reduce((a,r)=>a + (f(r)||0), 0);
  const sorties = sum(r=>r.cb&&r.cb.sorties);
  const kills   = sum(r=>r.kd&&r.kd.kills);
  const losses  = sum(r=>r.cb&&r.cb.deaths);
  const mins    = sum(r=>{ const sn=(D.seen||{})[r.name]; return sn&&sn.minutes; });
  const c = D.campaign, zs = Object.values((c&&c.zones)||{});
  const blue = zs.filter(z=>z.side===2).length;

  const t=[];
  if(mins)    t.push(`<div><b>${flown(mins)}</b><span>Flown</span></div>`);
  if(sorties) t.push(`<div><b>${sorties}</b><span>Sorties</span></div>`);
  if(kills)   t.push(`<div><b>${kills}</b><span>Kills</span></div>`);
  if(losses)  t.push(`<div><b>${losses}</b><span>Losses</span></div>`);
  if(zs.length) t.push(`<div><b>${blue}/${zs.length}</b><span>Zones held</span></div>`);
  return t.length ? `<div class="tot2">${t.join('')}</div>` : '';
}

function pilotCard(r, pos, count, total, leader){
  const av=avatar(r.name);
  const share=total?Math.round(r.xp/total*100):0;
  const gap=leader-r.xp;

  const seen=(D.seen||{})[r.name]||null;
  const pills=[];
  if(r.unit) pills.push(`<span class="pill2">${esc(r.unit)}</span>`);
  if(r.on) pills.push(`<span class="pill2 ${r.side===1?'r':'b'}">${
    r.side===1?'RED':r.side===2?'BLUE':'SPECTATOR'}</span>`);
  if(r.role) pills.push(`<span class="badge role">${esc(r.role.tag)}</span>`);

  const notes=[];
  if(r.role) notes.push(esc(r.role.title));

  notes.push(r.on
    ? (r.unit?`Airborne now in a <b>${esc(r.unit)}</b>.`:'Connected now.')
    : (seen&&seen.last
        ? `Not connected — last seen <b>${ago(Date.now()/1000-seen.last)} ago</b>.`
        : 'Not connected.'));
  notes.push(`Holds <b>${share}%</b> of the squadron's total XP` +
    (gap>0?`, <b>${gap.toLocaleString()}</b> behind the leader.`:' — currently top of the board.'));

  if(r.cb){
    const cw=r.cb;
    // Sorties with no weapons released means transport or recce, which is a
    // role worth naming rather than showing as a row of zeroes.
    if(cw.sorties && !cw.shots && !cw.hits){
      notes.push('Flies <b>support</b> — sorties logged, no weapons released.');
    } else if(cw.shots || cw.hits){
      notes.push(`<b>${(cw.shots||0).toLocaleString()}</b> weapons released, ` +
        `<b>${(cw.hits||0).toLocaleString()}</b> ` +
        `<span title="One hit is logged per impact, so a cannon burst counts many. This is activity, not accuracy.">impacts</span>.`);
    }
    if(cw.ejects) notes.push(`Ejected <b>${cw.ejects}</b> time(s).`);
  }
  // Only OVERLORD has scope settings, so this line appears for exactly one person.
  if(r.cfg && r.cfg.gci_warning_radius!==undefined){
    notes.push(`GCI scope set to a <b>${r.cfg.gci_warning_radius}</b> ` +
      `${r.cfg.gci_metric?'km':'nm'} warning radius.`);
  }

  // A third-width card fits four tiles before the labels wrap, and there can
  // be eight candidates. Rank moved to the corner badge; the rest are offered
  // in the order a pilot would care about them and the list is then capped.
  //
  // Combat numbers come from the DCS log via pilot-stats.ps1. There is
  // deliberately no Kills tile: DCS emits no kill event at all, and inferring
  // one from hit-then-death misattributes assists and splash damage.
  const cb=r.cb;
  const TILE_CAP=4;
  // Kills come from gRPC's KillEvent -- a recorded kill, not the hit-then-death
  // guess I refused to ship off the DCS log, which has no kill event at all.
  const kd = r.kd;
  const ratio = (kd && kd.deaths) ? (kd.kills / kd.deaths).toFixed(2)
              : (kd ? String(kd.kills || 0) : null);

  const candidates=[
    [true,               r.xp.toLocaleString(),        'XP'],
    [!!(kd&&kd.kills),   kd&&kd.kills,                 'Kills'],
    [!!(kd&&(kd.kills||kd.deaths)), ratio,             'K/D'],
    [!!(kd&&kd.traps),   kd&&kd.traps,                 'Traps'],
    [!!cb,               cb&&(cb.sorties||0),          'Sorties'],
    [!!cb,               cb&&(cb.deaths||0),           'Losses'],
    [!!(seen&&seen.minutes>=1), seen&&flown(seen.minutes), 'Flown'],
    [!!cb,               cb&&(cb.landings||0),         'Landings'],
    [!!(seen&&seen.sessions), seen&&seen.sessions,     'Sessions'],
    [!!r.sb,             r.sb,                         'Survival'],
    [!!r.cmd,            r.cmd,                        'Commands'],
    [!cb,                share+'%',                    'Share'],
  ];
  const tiles=candidates.filter(c=>c[0]).slice(0,TILE_CAP)
    .map(c=>`<div><b>${c[1]}</b><span>${c[2]}</span></div>`);

  return `<div class="pcard${pos<=3?' p'+pos:''}" style="--avb:${av.bg};--avf:${av.fg}">
    <div class="prank">#${pos}</div>
    <div class="phead">
      <div class="pav">${esc(av.initials)}</div>
      <div>
        <div class="pname">${esc(r.name)}${
          r.on?' <span class="badge on">FLYING</span>':''}</div>
        <div class="ppills">${pills.join('')}</div>
        <div class="pnote">${notes.join('<br>')}</div>
      </div>
    </div>
    <div class="pstats">${tiles.join('')}</div>
  </div>`;
}

function renderPilots(){
  const rows=pilotRows();
  if(!rows.length){ $('#panel').innerHTML=
    `<div class="pnl"><h2>Squadron roster</h2>
     <div class="empty"><b>No roster yet</b>Pretense writes pilot records the first
     time someone flies. Nothing has been logged on this campaign.</div></div>`;
    return; }
  const tot=rows.reduce((a,r)=>a+r.xp,0);

  const th=(t,cls='')=>`<th class="${cls}">${t}</th>`;

  $('#panel').innerHTML=`<div class="pnl wide">
    <h2>Squadron roster</h2>
    <div class="sub">${rows.length} pilots &middot; <b>${tot.toLocaleString()} XP</b> on this
      campaign. XP carries across sessions and survives a restart.
      Select a callsign for the full record.</div>
    ${squadronTotals(rows)}
    ${rows.filter(r=>r.role).map(r=>`<div class="roles">
       <b>${esc(r.role.tag)}</b>${esc(r.name)} &middot; ${esc(r.role.title)}</div>`).join('')}

    <div class="srule"><span>Roster</span><i></i></div>
    <table class="lb"><thead><tr>
      ${th('')}${th('Callsign')}${th('Status','hide-s')}
      ${th('Sorties','r hide-s')}${th('Kills','r')}${th('Losses','r hide-s')}
      ${th('Flown','r hide-s')}${th('XP','r')}
    </tr></thead><tbody>
    ${rows.map((r,i)=>{
      const av=avatar(r.name), sn=(D.seen||{})[r.name];
      const kd=r.kd, cb=r.cb;
      return `<tr class="pr" data-p="${i}" tabindex="0" role="button"
                  aria-expanded="false" aria-label="Record for ${esc(r.name)}">
        <td class="pos"><span class="caret">&#9656;</span> ${i+1}</td>
        <td><div class="cs">
          <span class="pav" style="--avb:${av.bg};--avf:${av.fg}">${esc(av.initials)}</span>
          <span class="nmw">${esc(r.name)}</span>
          ${r.role?`<span class="badge role">${esc(r.role.tag)}</span>`:''}
        </div></td>
        <td class="hide-s">${r.on
          ? `<span class="badge on">FLYING</span>${r.unit?` <span class="pill2">${esc(r.unit)}</span>`:''}`
          : `<span style="color:var(--ink-3);font:400 11px var(--mono)">${
              sn&&sn.last?ago(Date.now()/1000-sn.last)+' ago':'--'}</span>`}</td>
        <td class="r hide-s">${cb?cb.sorties||0:'--'}</td>
        <td class="r">${kd&&kd.kills?kd.kills:'--'}</td>
        <td class="r hide-s">${cb?cb.deaths||0:'--'}</td>
        <td class="r hide-s">${sn&&sn.minutes>=1?flown(sn.minutes):'--'}</td>
        <td class="r" style="color:var(--ink)">${r.xp.toLocaleString()}</td>
      </tr>
      <tr class="det" data-d="${i}" style="display:none">
        <td class="detcell" colspan="8">${pilotCard(r,i+1,rows.length,tot,rows[0].xp)}</td>
      </tr>`;
    }).join('')}
    </tbody></table></div>`;

  // Accordion. Keyboard reachable, because a roster you cannot tab through is
  // not a roster.
  const open=(tr)=>{
    const i=tr.dataset.p;
    const det=$('#panel').querySelector(`tr.det[data-d="${i}"]`);
    const isOpen=det.style.display!=='none';
    $('#panel').querySelectorAll('tr.det').forEach(d=>d.style.display='none');
    $('#panel').querySelectorAll('tr.pr').forEach(p=>{
      p.classList.remove('open'); p.setAttribute('aria-expanded','false'); });
    if(!isOpen){ det.style.display=''; tr.classList.add('open');
                 tr.setAttribute('aria-expanded','true'); }
  };
  $('#panel').querySelectorAll('tr.pr').forEach(tr=>{
    tr.onclick=()=>open(tr);
    tr.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(tr); } };
  });
}

// --- Campaign history -------------------------------------------------------
//
// history.json is sampled by the publisher on the box, because Pretense only
// ever writes CURRENT state -- yesterday's front line is gone the moment it
// saves. Points land every 10 minutes, or immediately when a zone flips.

function renderHistory(){
  const h=(D.history||[]).filter(p=>p&&p.t&&(p.b+p.r)>0);
  const feed=(D.feed&&D.feed.feed)||[];

  const chart = h.length<2
    ? `<div class="empty"><b>Not enough history</b>The front line is sampled every
       10 minutes while the server runs.${h.length?' One sample so far.':''}</div>`
    : (()=>{
        const W=1000,H=200,PAD=4;
        const t0=h[0].t,t1=h[h.length-1].t,span=Math.max(1,t1-t0);
        const x=p=>((p.t-t0)/span)*W;
        const maxZ=Math.max(...h.map(p=>p.b+p.r),1);
        const yy=v=>H-PAD-(v/maxZ)*(H-PAD*2);
        const line=h.map((p,i)=>`${i?'L':'M'}${x(p).toFixed(1)},${yy(p.b).toFixed(1)}`).join('');
        const area=`${line}L${W},${H}L0,${H}Z`;
        const rline=h.map((p,i)=>`${i?'L':'M'}${x(p).toFixed(1)},${yy(p.r).toFixed(1)}`).join('');
        const first=h[0],last=h[h.length-1],delta=last.b-first.b;
        const dtxt=delta>0?`+${delta} zones to blue`:delta<0?`${delta} zones to blue`:'no net change';
        return `<div class="sub">${h.length} samples over ${ago(t1-t0)} &middot;
            <b>${dtxt}</b> in that window.</div>
          <div class="tlk">
            <span><i style="background:var(--blue)"></i>Blue held</span>
            <span><i style="background:var(--rose)"></i>Red held</span>
          </div>
          <div class="tlwrap">
            <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
                 aria-label="Zones held over time">
              <path d="${area}" fill="var(--blue)" opacity=".13"/>
              <path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2"
                    vector-effect="non-scaling-stroke"/>
              <path d="${rline}" fill="none" stroke="var(--rose)" stroke-width="2"
                    stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>
            </svg>
            <div class="tlx">
              <span>${new Date(t0*1000).toLocaleString()}</span>
              <span>${last.b} blue &middot; ${last.r} red</span>
              <span>${new Date(t1*1000).toLocaleString()}</span>
            </div>
          </div>`;
      })();

  const log = feed.length
    ? `<div class="log">${feed.slice(0,50).map(e=>`<div class="le ${esc(e.k)}">
         <span class="lt">${ago(Date.now()/1000-e.ts)}</span>
         <span class="lk">${esc(String(e.k).toUpperCase())}</span>
         <span class="lx">${esc(e.t)}</span></div>`).join('')}</div>`
    : `<div class="empty"><b>No events recorded</b>Kills, zone captures, carrier
       traps and connections appear here as they happen. The stream starts when
       the server does.</div>`;

  $('#panel').innerHTML=`<div class="pnl wide">
    <h2>Operations log</h2>
    <div class="srule"><span>Front line</span><i></i></div>
    ${chart}
    <div class="srule"><span>Events</span><i></i></div>
    ${log}
  </div>`;
}

// --- Files ------------------------------------------------------------------
//
// Deliberately links to sources rather than rehosting. Two reasons: 2.4 GB of
// mods through CloudFront costs real money per download, and pointing pilots
// at a private copy of somebody else's mod is how people end up on a build
// that does not match the server.
//
// The VERSIONS are the load-bearing part of this page. A mod aircraft only
// appears in the dynamic-spawn list if the client has the same build the
// server does, and the failure mode is a silently missing airframe.

const FILES=[
  {n:'DCS World',            v:'2.9.28.26385', src:'https://www.digitalcombatsimulator.com/en/downloads/world/',
   d:'The server tracks stable. If your client is on a different build you cannot join at all.'},
  {n:'DCS-SimpleRadio Standalone', v:'2.3.8.2', src:'https://github.com/ciribob/DCS-SimpleRadioStandalone/releases',
   d:'Voice comms on port 5002. The client auto-connects when you join; version must match the server exactly.'},
  {n:'Su-30MKI "Flanker Ex"', v:'Su-30_EFM_V2.8.06b', src:'',
   d:'Codename Flanker. Install to Saved Games\\DCS\\Mods\\aircraft\\.'},
  {n:'Hercules',             v:'6.8.2',        src:'',
   d:'Anubis C-130J. Install to Saved Games\\DCS\\Mods\\aircraft\\.'},
  {n:'UH-60L Black Hawk',    v:'2.1.5',        src:'',
   d:'Kinkku. Also gives you UH-60L_DAP and the KC-130J tanker. Its Scripts\\Hooks\\bhHook.lua goes in YOUR Saved Games (it drives the door gunners) — it is deliberately not on the server.'}
];

function renderFiles(){
  $('#panel').innerHTML=`<div class="pnl">
    <h2>Mission support</h2>
    <div class="sub">Everything a pilot needs installed to fly here, with the exact
      build the server runs.</div>
    <div class="req"><b>Versions must match exactly.</b>
      A mod aircraft on a different build will not appear in your spawn list, and
      there is no error message. If an airframe is missing, check the version here first.</div>
    <div class="srule"><span>Required packages</span><i></i></div>
    <div class="dl">
      ${FILES.map(f=>`<div class="dlc">
        <div class="meta">
          <div class="n">${esc(f.n)}</div>
          <div class="d">${f.d}</div>
        </div>
        <div class="v">${esc(f.v)}</div>
        <div class="act">${f.src
          ? `<a href="${f.src}" target="_blank" rel="noopener noreferrer">Download &rarr;</a>`
          : '<span class="ask">Ask in Discord<br>for the link</span>'}</div>
      </div>`).join('')}
    </div>
    <div class="srule"><span>Connection</span><i></i></div>
    <div class="dl">
      <div class="dlc"><div class="meta"><div class="n">Game server</div>
        <div class="d">Multiplayer &rarr; Connect by IP</div></div>
        <div class="v">${D.status?esc(D.status.address):'--'}</div><div class="act"></div></div>
      <div class="dlc"><div class="meta"><div class="n">SRS voice</div>
        <div class="d">Auto-connects when you join</div></div>
        <div class="v">${D.status&&D.status.srs?esc(D.status.srs):'--'}</div>
        <div class="act"></div></div>
    </div>
  </div>`;
}

const PANELS={pilots:renderPilots, history:renderHistory, files:renderFiles};

function draw(){
  renderHeader();
  syncHeaderHeight();
  const isList=view==='list', isPanel=!!PANELS[view], isMap=!isList&&!isPanel;

  $('#list').style.display  = isList ?'grid' :'none';
  $('#map').style.display   = isMap  ?'block':'none';
  $('#panel').style.display = isPanel?'block':'none';

  // The whole filter bar belongs to Ops. Leaving an empty strip on Map or
  // Pilots was 38px of chrome that answered nothing.
  $('#filters').style.display = isList?'flex':'none';

  $('#hud').style.display      = isMap?'grid':'none';
  $('#hud').setAttribute('aria-hidden', isMap?'false':'true');
  $('#gci').style.display      = (isMap&&intel)?'block':'none';
  $('#hud').classList.toggle('panelled', isMap&&intel);
  $('#intel').classList.toggle('on', intel);
  $('#intel').setAttribute('aria-pressed', intel?'true':'false');

  if(isList) renderList();
  else if(isPanel) PANELS[view]();
  else { map.invalidateSize(); renderMap(intel); mapNote(); renderHud();
         if(intel) renderGci(); }
}

$('#views').querySelectorAll('.sb').forEach(b=>b.onclick=()=>{
  view=b.dataset.v;
  $('#views').querySelectorAll('.sb').forEach(x=>{
    const on = x===b;
    x.classList.toggle('on',on);
    x.setAttribute('aria-selected', on?'true':'false');
  });
  draw();
});

$('#intel').onclick=()=>{
  intel=!intel;
  try { localStorage.setItem('sf-intel', intel?'1':'0'); } catch(e) {}
  // The map's usable width changes when the panel appears, so Leaflet has to
  // be told before anything is redrawn against the new size.
  map.invalidateSize();
  draw();
};

async function tick(){
  const [st,cp,lv,pl,hs,sn]=await Promise.all([
    grab('status.json'),grab('campaign.json'),grab('live.json'),
    grab('pilots.json'),grab('history.json'),grab('pilots-seen.json')]);
  if(!D.zones) D.zones = await grab('zones.json');
  const cb = await grab('combat.json'); if(cb) D.combat = cb;
  const kd = await grab('combat-events.json'); if(kd) D.kd = kd;
  const fd = await grab('events.json'); if(fd) D.feed = fd;
  D.status=st; D.campaign=cp;
  // Keep the last good copy: a 403 while the server is asleep should not blank
  // a leaderboard that is perfectly valid history.
  if(pl) D.pilots=pl;
  if(sn) D.seen=sn;
  if(Array.isArray(hs)) D.history=hs;
  // Live data outlives the server by design; ignore it once stale or the map
  // shows aircraft frozen in mid-air from days ago.
  D.live = lv && (Date.now()/1000-lv.ts)<STALE ? lv : null;
  draw();
  $('#upd').textContent='updated '+new Date().toLocaleTimeString();
}
renderCats(); syncHeaderHeight(); tick(); setInterval(tick,POLL);

// ResizeObserver catches wraps caused by width changes AND by content changes;
// the resize listener is the fallback for browsers without it.
if(typeof ResizeObserver !== 'undefined' && $('#hdr')){
  new ResizeObserver(syncHeaderHeight).observe($('#hdr'));
} else if(typeof addEventListener === 'function'){
  addEventListener('resize', syncHeaderHeight);
}
