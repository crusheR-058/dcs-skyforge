<!-- Archivo for words, IBM Plex Mono for every number. Both come from the
     technical/industrial world rather than the usual UI-font shortlist, and
     the split is the rule that makes the whole board read as an instrument.
     Preconnect because these block first paint of the masthead. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ===================================================================
   SKYFORGE - air operations board
   Palette is derived from an unlit operations room and a sectional
   chart: cool graphite surfaces, chart blue for own forces, a
   desaturated chart red for hostile. Nothing here is decorative --
   if a colour appears, it means something.
   =================================================================== */
:root{
  /* surfaces, darkest to lightest */
  --graphite:#0A0E14;
  --slate:#111823;
  --panel:#161F2B;
  --raised:#1D2836;

  /* hairlines. --rule is structural, --rule-2 separates, --rule-hot is focus */
  --rule:#1E2836;
  --rule-2:#283444;
  --rule-hot:#3A5570;

  /* text */
  --ink:#E6EDF7;
  --ink-2:#94A5BC;
  --ink-3:#5E6E85;

  /* semantic. Blue = friendly/own, rose = hostile, amber = attention,
     jade = ready. Never used decoratively. */
  --blue:#4C8FE8;
  --blue-dim:#2C5A94;
  --rose:#D9455C;
  --amber:#E8A33D;
  --jade:#45C08A;
  --neutral:#7C8CA3;

  /* Rank insignia. These are the only non-semantic colours on the board:
     they belong to a real-world artifact -- the IAF shoulder board -- the way
     a flag or a squadron patch owns its colours, so they are reproduced rather
     than mapped onto the palette. Nothing else may use them. */
  --iaf-board:#2E3E5F;
  --iaf-braid:#A6D6F5;
  --iaf-gold:#D9AE4A;

  /* type */
  --ui:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  --r:3px;              /* small radius on purpose: zero everywhere is a tell */
  --hdrh:150px;

  /* Transitional aliases, removed as each view is rebuilt in later phases.
     Note what happens to the old category colours: violet, cyan and pink all
     collapse to neutral, because colour now means faction and nothing else.
     SEAD being violet and CSAR being pink told a pilot nothing. */
  --bg:var(--graphite);
  --panel2:var(--raised);
  --line:var(--rule);
  --fg:var(--ink);
  --dim:var(--ink-2);
  --dimmer:var(--ink-3);
  --red:var(--rose);
  --green:var(--jade);
  --violet:var(--ink-2);
  --cyan:var(--ink-2);
  --pink:var(--ink-2);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--graphite);color:var(--ink);
  font:400 13px/1.5 var(--ui);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}

/* ---------- page substrate ----------
   A fixed layer beneath every view except Map, carrying the chart apparatus
   the board is already dressed as: a graticule, ruled margins, and a ghost of
   the theatre itself. It never intercepts a pointer and never scrolls.

   Contrast is capped hard and deliberately. Tasking rows (.mc) are
   transparent, so this sits directly behind body text on the Ops page; the
   grid is drawn at 2.5% and the 5-minor emphasis at 4.5%, which reads on an
   unlit panel and disappears the moment your eye lands on a number. If you
   raise these, check Ops at 1366 before you keep it. */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background-image:
    repeating-linear-gradient(to right,
      rgba(230,237,247,.045) 0 1px, transparent 1px 320px),
    repeating-linear-gradient(to bottom,
      rgba(230,237,247,.045) 0 1px, transparent 1px 320px),
    repeating-linear-gradient(to right,
      rgba(230,237,247,.025) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(to bottom,
      rgba(230,237,247,.025) 0 1px, transparent 1px 64px)}

/* The grid is apparatus, not information. Anyone who has asked not to be
   given decoration should not be given it. */
@media(prefers-reduced-motion:reduce){#bg{background-image:none}}

/* Margin apparatus. Only on the document pages, only where a margin exists.
   #bg sits behind the fixed header, so everything here starts below it. */
#bg .reg{display:none;position:absolute;width:13px;height:13px;
  border:1px solid rgba(230,237,247,.13)}
#bg .reg.tl{top:calc(var(--hdrh) + 16px);left:16px;border-right:0;border-bottom:0}
#bg .reg.tr{top:calc(var(--hdrh) + 16px);right:16px;border-left:0;border-bottom:0}
#bg .reg.bl{bottom:16px;left:16px;border-right:0;border-top:0}
#bg .reg.br{bottom:16px;right:16px;border-left:0;border-top:0}

/* The theatre watermark. Anchored bottom-right, where every page has its
   deepest dead area. Hidden on a phone: 47vw of a 414px screen is 190px of
   dots behind an already tight roster. */
#ghost{display:none;position:absolute;right:2vw;bottom:2.5vh;
  width:40vw;height:44vh}
#ghost svg{width:100%;height:100%;overflow:visible}
@media(min-width:1000px){#ghost{display:block}}

@media(min-width:1600px){
  #bg.doc .reg{display:block}
  /* Edge rulers, one per margin. */
  #bg.doc::before,#bg.doc::after{content:'';position:absolute;
    top:calc(var(--hdrh) + 40px);bottom:40px;width:7px;
    background:repeating-linear-gradient(to bottom,
      rgba(230,237,247,.09) 0 1px, transparent 1px 15px)}
  #bg.doc::before{left:29px}
  #bg.doc::after{right:29px}
}
a{color:var(--blue)}

/* Every number in this interface is mono and tabular. That single rule is
   what makes columns line up and readouts look like instruments. */
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Type roles. Mono for eyebrows is a chart/ops convention, not decoration. */
.eyebrow{font:500 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3)}

:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- masthead ---------- */
#hdr{position:fixed;top:0;left:0;right:0;z-index:1000;
  background:linear-gradient(180deg,var(--slate) 0%,rgba(17,24,35,.97) 100%);
  border-bottom:1px solid var(--rule)}

.masthead{display:flex;align-items:stretch;height:52px;
  border-bottom:1px solid var(--rule)}

.brand{display:flex;align-items:center;gap:11px;padding:0 18px;flex:none;
  border-right:1px solid var(--rule);text-decoration:none;color:inherit}
.brand .crest{display:block;width:38px;height:38px;flex:none}
.wordmark{font:700 17px/1 var(--ui);letter-spacing:.11em;color:var(--ink)}
.brand .sub{font:500 8.5px/1 var(--mono);letter-spacing:.22em;color:var(--ink-3);
  border-left:1px solid var(--rule-2);padding-left:10px;margin-left:1px}

/* Theatre block: the one place a name and its metadata sit together. */
#theatre{display:flex;align-items:center;gap:12px;padding:0 18px;flex:none;
  border-right:1px solid var(--rule)}
#theatre .tname{font:600 13px/1.2 var(--ui);letter-spacing:.01em}
#theatre .tmeta{font:400 9.5px/1.2 var(--mono);letter-spacing:.13em;color:var(--ink-3);
  text-transform:uppercase}
#theatre .tally{display:flex;gap:1px;margin-left:2px}
#theatre .tally b{font:500 11px/1 var(--mono);padding:5px 8px;background:var(--panel);
  border:1px solid var(--rule-2)}
#theatre .tally b:first-child{border-radius:var(--r) 0 0 var(--r);color:var(--ink-2)}
#theatre .tally b:last-child{border-radius:0 var(--r) var(--r) 0;color:var(--amber)}

nav#views{display:flex;align-items:stretch;margin-left:auto}
nav#views .sb{position:relative;padding:0 20px;display:flex;align-items:center;
  font:500 11.5px/1 var(--ui);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);border-left:1px solid var(--rule);
  transition:color .16s ease,background .16s ease}
nav#views .sb:hover{color:var(--ink-2);background:rgba(76,143,232,.05)}
nav#views .sb.on{color:var(--ink);background:var(--panel)}
/* The active marker is a top rule, like a selected tab on a flight strip
   board -- not a pill, which is what every dashboard reaches for. */
nav#views .sb.on::before{content:'';position:absolute;left:0;right:0;top:-1px;
  height:2px;background:var(--blue)}

/* ---------- telemetry rail ---------- */
#rail{display:flex;align-items:center;gap:0;height:34px;overflow-x:auto;
  scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
#rail .cell{display:flex;align-items:center;gap:7px;padding:0 14px;height:100%;
  flex:none;border-right:1px solid var(--rule);white-space:nowrap}
#rail .cell .k{font:500 9px/1 var(--mono);letter-spacing:.16em;color:var(--ink-3);
  text-transform:uppercase}
#rail .cell .v{font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums;
  color:var(--ink)}
#rail .cell.state .v{font-weight:600;letter-spacing:.08em}
#rail .cell.on   .v{color:var(--jade)}
#rail .cell.off  .v{color:var(--rose)}
#rail .cell.blue .v{color:var(--blue)}
#rail .cell.rose .v{color:var(--rose)}
/* The instrument line: a single readout, the way weather is actually read. */
#rail .metar{font:400 11.5px/1 var(--mono);letter-spacing:.06em;color:var(--ink-2)}
#rail .metar b{color:var(--ink);font-weight:500}
#rail .grow{flex:1 1 auto;border-right:0}
#rail .addr{cursor:pointer}
#rail .addr:hover .v{color:var(--blue)}

/* live pulse: state, not decoration -- it ticks when data lands */
.beat{width:6px;height:6px;border-radius:50%;flex:none;background:var(--ink-3)}
.beat.on{background:var(--jade);box-shadow:0 0 0 0 rgba(69,192,138,.55);
  animation:beat 2.4s ease-out infinite}
.beat.off{background:var(--rose)}
@keyframes beat{
  0%{box-shadow:0 0 0 0 rgba(69,192,138,.5)}
  70%{box-shadow:0 0 0 7px rgba(69,192,138,0)}
  100%{box-shadow:0 0 0 0 rgba(69,192,138,0)}
}

/* ---------- filter bar (List view only) ---------- */
#filters{display:flex;align-items:center;gap:12px;height:38px;padding:0 18px;
  border-top:1px solid var(--rule);background:var(--graphite)}
#cats{display:flex;gap:6px;flex-wrap:wrap}
/* Category is a mono tag on a neutral chip. It deliberately carries no colour:
   colour is reserved for faction, so a red chip always means hostile. */
.fb{font:500 9.5px/1 var(--mono);letter-spacing:.13em;padding:5px 9px;
  border:1px solid var(--rule-2);border-radius:var(--r);color:var(--ink-3);
  background:transparent;transition:all .16s ease}
.fb:hover{color:var(--ink-2);border-color:var(--rule-hot)}
.fb.on{color:var(--ink);border-color:var(--blue);background:rgba(76,143,232,.1)}
#upd{margin-left:auto;font:400 10px/1 var(--mono);color:var(--ink-3);
  letter-spacing:.08em}

@media(max-width:1100px){
  .brand .sub{display:none}
  #theatre .tmeta{display:none}
  nav#views .sb{padding:0 13px;letter-spacing:.08em}
}
@media(max-width:760px){
  /* The nav needs its own row on a phone. Without flex-wrap it just ran off
     the right edge and the last two views were unreachable. */
  .masthead{height:auto;flex-wrap:wrap}
  .brand{padding:0 12px;gap:8px}
  .brand .crest{width:32px;height:32px}
  .wordmark{font-size:14px;letter-spacing:.08em}
  #theatre{padding:0 12px}
  .brand{flex:1;min-width:0;height:46px}
  #theatre{height:46px;margin-left:auto;border-right:0}
  nav#views{width:100%;border-top:1px solid var(--rule);margin-left:0}
  nav#views .sb{flex:1;justify-content:center;padding:12px 4px;font-size:10px;
    letter-spacing:.06em;border-left:1px solid var(--rule)}
  nav#views .sb:first-child{border-left:0}

  /* On a phone the filter bar is the least valuable row: keep the chips,
     drop the label and the clock. */
  #filters{height:auto;padding:8px 12px;flex-wrap:wrap;gap:8px}
  #filters .eyebrow,#upd{display:none}
  #rail .cell{padding:0 11px}
}

/* ---------- body ---------- */
#main{position:absolute;inset:0;padding-top:var(--hdrh)}
#map{height:100%;background:#070a0e}

/* Two tasking columns. On a wide screen they sit side by side; the gutter is
   a hairline rather than whitespace so the board reads as one document. */
#list{height:100%;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;
  align-content:start}
#list .col{min-width:0;border-right:1px solid var(--rule)}
#list .col:last-child{border-right:0}

.colhead{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:10px;
  padding:11px 16px 10px;background:var(--graphite);
  border-bottom:1px solid var(--rule)}
.colhead h3{margin:0;font:600 11px/1 var(--ui);letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-2)}
.colhead .n{font:500 11px/1 var(--mono);color:var(--ink-3)}
.colhead .rule{flex:1;height:1px;background:var(--rule-2)}

/* ---------- tasking line ---------- */
.mc{position:relative;display:grid;
  grid-template-columns:44px 1fr auto;
  gap:0 12px;align-items:center;
  padding:9px 16px 9px 0;
  border-bottom:1px solid var(--rule);
  cursor:default;transition:background .14s ease}
.mc:hover{background:rgba(76,143,232,.045)}

/* The margin tape. Faction, always -- never mission type. */
.mc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--tape,var(--neutral));transition:width .14s ease}
.mc:hover::before{width:5px}
.mc.blue{--tape:var(--blue)}
.mc.red{--tape:var(--rose)}

/* Tasking number. The one place a big mono figure earns its size. */
.mc .tno{grid-column:1;grid-row:1/3;justify-self:end;
  font:500 15px/1 var(--mono);font-variant-numeric:tabular-nums;
  color:var(--ink-3);letter-spacing:-.02em}
.mc:hover .tno{color:var(--ink-2)}

.mc .mid{grid-column:2;grid-row:1;min-width:0}
.mc .top{display:flex;align-items:center;gap:8px;min-width:0}
.mc .obj{font:600 13.5px/1.25 var(--ui);color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .cat{font:500 9px/1 var(--mono);letter-spacing:.14em;padding:3px 6px;
  border:1px solid var(--rule-2);border-radius:2px;color:var(--ink-3);flex:none}
.mc .desc{font:400 11.5px/1.45 var(--ui);color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* Right-hand data block: fixed columns so the eye runs down, not across. */
.mc .right{grid-column:3;grid-row:1/3;display:flex;align-items:center;gap:16px;flex:none}
.mc .thr{display:flex;gap:2px;align-items:center}
.mc .thr i{width:3px;height:11px;background:var(--rule-2);border-radius:1px}
.mc .thr i.f{background:var(--amber)}
.mc .xp{font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums;
  color:var(--ink-2);min-width:52px;text-align:right}
.mc .aux{font:400 10px/1 var(--mono);color:var(--ink-3);min-width:56px;
  text-align:right}

/* Active tasking: progress is the point, so it becomes the baseline of the row. */
.mc.act .bar{grid-column:2/4;grid-row:2;height:2px;background:var(--rule);margin-top:7px;
  position:relative;overflow:hidden}
.mc.act .bar i{position:absolute;inset:0 auto 0 0;background:var(--blue)}
.mc.act.done .bar i{background:var(--jade)}
.mc .pct{font:500 11px/1 var(--mono);color:var(--ink-2);min-width:38px;text-align:right}
.mc.act.done .pct{color:var(--jade)}

/* Expiring work is the only thing allowed to use amber in this list. */
.mc.urgent .aux{color:var(--amber)}

.empty{padding:22px 16px;font:400 12px/1.5 var(--ui);color:var(--ink-3)}
/* First paint happens before any fetch resolves. An empty screen reads as
   broken, so say what is happening instead. */
.boot{padding:40px 20px;text-align:center;color:var(--ink-3);
  font:400 12px/1.7 var(--ui)}
.boot b{display:block;font:500 10px/1 var(--mono);letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.boot .bars{display:flex;gap:3px;justify-content:center;margin-bottom:14px}
.boot .bars i{width:3px;height:14px;background:var(--rule-2);
  animation:boot 1.1s ease-in-out infinite}
.boot .bars i:nth-child(2){animation-delay:.12s}
.boot .bars i:nth-child(3){animation-delay:.24s}
.boot .bars i:nth-child(4){animation-delay:.36s}
@keyframes boot{0%,100%{background:var(--rule-2)}50%{background:var(--blue)}}
.empty b{display:block;font:500 11px/1 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}

@media(max-width:1000px){
  #list{grid-template-columns:1fr}
  #list .col{border-right:0;border-bottom:1px solid var(--rule-2)}
}
@media(max-width:560px){
  .mc{grid-template-columns:34px 1fr;padding-right:12px}
  .mc .right{grid-row:2;grid-column:2;justify-content:flex-start;
    gap:12px;margin-top:5px}
  .mc.act .bar{grid-row:3}
  .mc .desc{white-space:normal}
}

/* --- pilot detail card --------------------------------------------------- */
.pgrid{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1400px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1000px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.pgrid{grid-template-columns:1fr}}

/* A standalone tile now, rather than something glued under a table row. */
.pgrid .pcard{position:relative;overflow:hidden;
  border:1px solid var(--line);border-radius:10px;
  background:var(--panel);display:flex;flex-direction:column}
.pgrid .pcard:hover{border-color:rgba(74,158,255,.35)}

/* Ordering is the one thing lost by dropping the numbered table, so make the
   podium readable at a glance instead. */
.pgrid .pcard.p1{border-color:rgba(255,200,72,.45)}
.pgrid .pcard.p2{border-color:rgba(190,200,215,.32)}
.pgrid .pcard.p3{border-color:rgba(205,127,50,.38)}
.prank{position:absolute;top:12px;right:14px;font:600 11px/1 ui-sans-serif,system-ui;
  color:var(--dimmer);letter-spacing:.06em}
.pcard.p1 .prank{color:#ffc848} .pcard.p2 .prank{color:#bec8d7}
.pcard.p3 .prank{color:#cd7f32}
.pgrid .pnote{flex:1}
/* Bottom-align the stat strip so a row of cards with different note lengths
   still lines its numbers up. */
.pgrid .pstats{margin-top:auto}
.pgrid .pname{padding-right:34px}

.pcard{border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;
  padding:18px 20px 0;margin:0 0 12px}
.phead{display:flex;gap:14px;align-items:flex-start}
.pav{width:44px;height:44px;border-radius:var(--r);flex:none;display:grid;
  place-items:center;font:600 15px/1 var(--mono);letter-spacing:.04em;
  background:var(--raised);color:var(--ink-2);border:1px solid var(--rule-2)}
.pname{font:600 17px/1.2 ui-sans-serif,system-ui;color:#ffc848;margin-bottom:7px}
.ppills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill2{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:3px 9px;font-size:11px;color:var(--dim)}
.pill2.b{border-color:rgba(74,158,255,.4);color:var(--blue)}
.pill2.r{border-color:rgba(255,77,77,.4);color:var(--red)}
.pnote{font-size:12.5px;color:var(--dim);line-height:1.75}
.pstats{display:flex;gap:0;margin:16px -20px 0;border-top:1px solid var(--line)}
.pstats>div{flex:1;min-width:0;padding:12px 8px;text-align:center;
  border-right:1px solid rgba(255,255,255,.05)}
.pstats>div:last-child{border-right:0}
.pstats b{display:block;font:600 17px/1.2 ui-sans-serif,system-ui;color:var(--fg);
  overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.pstats span{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--dimmer);margin-top:3px}

/* --- activity feed ------------------------------------------------------- */
.feed{margin-top:4px}
.fe{display:flex;gap:8px;align-items:baseline;padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,.045);line-height:1.35}
.fe:last-child{border-bottom:0}
.fe .ft{flex:none;font-size:10px;color:var(--dimmer);font-variant-numeric:tabular-nums}
.fe .fk{flex:none;font-size:9px;letter-spacing:.1em;padding:1px 5px;border-radius:4px;
  background:rgba(255,255,255,.06);color:var(--dim)}
.fe.kill .fk{background:rgba(255,77,77,.18);color:var(--red)}
.fe.capture .fk{background:rgba(74,158,255,.18);color:var(--blue)}
.fe.trap .fk{background:rgba(255,200,72,.18);color:#ffc848}
.fe.join .fk,.fe.leave .fk{background:rgba(74,222,128,.14);color:#4ade80}
.fe .fx{color:var(--fg)}
/* --- squadron totals ----------------------------------------------------- */
.tot2{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 18px}
.tot2 div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:8px 13px;min-width:88px}
.tot2 b{display:block;font:600 17px/1.2 ui-sans-serif,system-ui;
  font-variant-numeric:tabular-nums}
.tot2 span{display:block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dimmer);margin-top:3px}

/* Motion communicates state and nothing else. Anyone who has asked their
   system to stop animating gets a still interface, including the live pulse. */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  .beat.on{animation:none}
}

/* ===================== MAP HUD ===================== */
/* Corners only. The centre of the map is operational surface and stays clear. */
#hud{position:absolute;inset:var(--hdrh) 0 0 0;z-index:600;pointer-events:none;
  transition:right .18s ease;
  display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto;
  padding:12px;gap:8px}
#hud > *{pointer-events:auto}
/* When the workstation is open it owns the right edge; the HUD steps aside. */
#hud.panelled{right:326px}
@media(max-width:900px){#hud.panelled{right:0}}
#hud .tl{grid-area:1/1;justify-self:start;align-self:start}
#hud .tr{grid-area:1/3;justify-self:end;align-self:start}
#hud .bl{grid-area:3/1;justify-self:start;align-self:end}
#hud .br{grid-area:3/3;justify-self:end;align-self:end}
#hud .bc{grid-area:3/2;justify-self:center;align-self:end}

.hudbox{background:rgba(10,14,20,.86);border:1px solid var(--rule-2);
  border-radius:var(--r);backdrop-filter:blur(3px)}

/* top-left: what am I looking at */
.hud-theatre{display:flex;align-items:stretch}
.hud-theatre .t{padding:7px 11px;font:600 11px/1 var(--ui);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink);border-right:1px solid var(--rule-2)}
.hud-theatre .z{padding:7px 11px;font:500 11px/1 var(--mono);color:var(--ink-2)}

/* top-right: can I trust this picture */
.hud-tr{display:flex;gap:8px;align-items:flex-start}
.feedstate{display:flex;align-items:center;gap:7px;padding:7px 11px;
  font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.feedstate.live{color:var(--jade)} .feedstate.lag{color:var(--amber)}
.feedstate.dead{color:var(--rose)}

#intel{padding:7px 13px;font:600 10px/1 var(--mono);letter-spacing:.18em;
  color:var(--ink-3);background:rgba(10,14,20,.86);
  border:1px solid var(--rule-2);border-radius:var(--r);
  transition:color .16s ease,border-color .16s ease,background .16s ease}
#intel:hover{color:var(--ink-2);border-color:var(--rule-hot)}
#intel.on{color:var(--ink);border-color:var(--blue);background:rgba(76,143,232,.16)}

/* bottom-left: a map that does not tell you where the cursor is isn't a map */
.hud-pos{display:flex;align-items:stretch;font:500 11px/1 var(--mono)}
.hud-pos span{padding:7px 10px;color:var(--ink-2);
  border-right:1px solid var(--rule-2);font-variant-numeric:tabular-nums}
.hud-pos span:last-child{border-right:0;color:var(--ink-3)}

/* bottom-right: legend */
.hud-legend{padding:9px 11px;display:grid;gap:5px;width:max-content}
.hud-legend div{display:flex;align-items:center;gap:8px;
  font:400 10px/1 var(--mono);letter-spacing:.09em;color:var(--ink-3);
  text-transform:uppercase;white-space:nowrap}
.hud-legend i{width:8px;height:8px;border-radius:50%;flex:none}
.hud-legend i.sq{border-radius:1px;width:9px;height:9px}
.hud-legend i.ring{background:none;border:1.5px solid currentColor}

/* the source-and-age line, centred and quiet */
#mapnote{padding:6px 12px;font:400 10.5px/1 var(--mono);letter-spacing:.05em;
  color:var(--ink-3);background:rgba(10,14,20,.8);border:1px solid var(--rule);
  border-radius:var(--r);max-width:min(92vw,760px);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Leaflet chrome, brought in line with everything else */
.leaflet-top.leaflet-left{top:46px}
.leaflet-control-zoom{border:1px solid var(--rule-2)!important;
  border-radius:var(--r)!important;overflow:hidden;box-shadow:none!important}
.leaflet-control-zoom a{background:rgba(10,14,20,.9)!important;color:var(--ink-2)!important;
  border-bottom:1px solid var(--rule-2)!important;width:28px!important;height:28px!important;
  line-height:27px!important;font-size:15px!important;font-family:var(--mono)!important}
.leaflet-control-zoom a:hover{background:var(--panel)!important;color:var(--ink)!important}
.leaflet-control-attribution{background:rgba(10,14,20,.8)!important;
  font:400 9px/1.5 var(--mono)!important;color:var(--ink-3)!important;
  border-top-left-radius:var(--r)}
.leaflet-control-attribution a{color:var(--ink-3)!important}
.leaflet-popup-content-wrapper{background:var(--panel)!important;color:var(--ink)!important;
  border:1px solid var(--rule-2)!important;border-radius:var(--r)!important;
  box-shadow:0 8px 28px rgba(0,0,0,.55)!important}
.leaflet-popup-content{font:400 12px/1.55 var(--ui)!important;margin:10px 12px!important}
.leaflet-popup-content b{font:600 12px/1.4 var(--ui)}
.leaflet-popup-tip{background:var(--panel)!important;border:1px solid var(--rule-2)!important}
.trk{font:500 9px/1.25 var(--mono);letter-spacing:.06em;text-shadow:0 0 3px #000,0 0 6px #000}

@media(max-width:760px){
  #hud{padding:8px}
  .hud-legend,.hud-pos{display:none}
}

/* ===================== GCI WORKSTATION ===================== */
#gci{position:absolute;top:var(--hdrh);right:0;bottom:0;width:326px;z-index:620;
  overflow-y:auto;background:rgba(13,18,26,.96);backdrop-filter:blur(6px);
  border-left:1px solid var(--rule-2);
  font:400 12px/1.45 var(--ui)}
@media(max-width:900px){#gci{display:none!important}}

#gci h3{position:sticky;top:0;z-index:2;margin:0;padding:9px 14px 7px;
  font:500 9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3);background:rgba(13,18,26,.98);
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
#gci h3:first-child{border-top:0}
#gci h3 em{font-style:normal;color:var(--ink-2);float:right}

#gci .row{display:flex;justify-content:space-between;gap:10px;
  padding:5px 14px;line-height:1.35;border-bottom:1px solid rgba(255,255,255,.03)}
#gci .row:hover{background:rgba(76,143,232,.05)}
#gci .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
#gci .rt{flex:none;font:500 11px/1.35 var(--mono);font-variant-numeric:tabular-nums;
  color:var(--ink-2)}
#gci .rt.warn{color:var(--amber)}
#gci .none{padding:8px 14px;color:var(--ink-3);font-size:11px;font-style:italic}

/* the air-picture summary: three numbers, read at a glance */
#gci .pic{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule)}
#gci .pic div{padding:9px 6px;text-align:center;border-right:1px solid var(--rule)}
#gci .pic div:last-child{border-right:0}
#gci .pic b{display:block;font:600 17px/1 var(--mono);font-variant-numeric:tabular-nums}
#gci .pic span{display:block;font:500 8.5px/1 var(--mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);margin-top:5px}
#gci .pic .b b{color:var(--blue)} #gci .pic .r b{color:var(--rose)}
#gci .pic .n b{color:var(--ink-2)}

#gci .dot{width:6px;height:6px;border-radius:50%;display:inline-block;
  margin-right:7px;vertical-align:1px}


/* ===================== PANEL VIEWS ===================== */
#panel{height:100%;overflow-y:auto}
.pnl{max-width:1280px;margin:0 auto;padding:26px 26px 60px}
.pnl.wide{max-width:1500px}
.pnl h2{margin:0 0 4px;font:600 15px/1.2 var(--ui);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink)}
.pnl .sub{font:400 12px/1.6 var(--ui);color:var(--ink-3);max-width:70ch;margin-bottom:20px}
.pnl .sub b{color:var(--ink-2);font-weight:500}

/* section rule: a label sitting on a hairline, the way a form divides itself */
.srule{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.srule span{font:500 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3);flex:none}
.srule i{flex:1;height:1px;background:var(--rule)}

/* ---------- squadron totals ---------- */
/* Sized to content. auto-fit + 1fr stretched four figures across 1500px and
   turned a summary into four billboards. */
.tot2{display:inline-grid;grid-auto-flow:column;
  border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:6px}
.tot2 div{padding:11px 20px;border-right:1px solid var(--rule);min-width:96px}
.tot2 div:last-child{border-right:0}
.tot2 b{display:block;font:600 20px/1 var(--mono);font-variant-numeric:tabular-nums;
  color:var(--ink)}
.tot2 span{display:block;font:500 8.5px/1 var(--mono);letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink-3);margin-top:6px}

.roles{font:400 12px/1.7 var(--ui);color:var(--ink-3);margin-top:10px}
.roles b{font:500 10px/1 var(--mono);letter-spacing:.15em;color:var(--amber);
  border:1px solid rgba(232,163,61,.35);border-radius:2px;padding:3px 6px;margin-right:8px}

/* ---------- roster ---------- */
table.lb{width:100%;border-collapse:collapse;margin-top:6px}
table.lb thead th{position:sticky;top:0;z-index:2;background:var(--graphite);
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule-2);
  font:500 9px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
table.lb thead th.r{text-align:right}
table.lb tr.pr{cursor:pointer;transition:background .14s ease}
table.lb tr.pr:hover td{background:rgba(76,143,232,.05)}
table.lb tr.pr.open td{background:rgba(76,143,232,.09)}
table.lb td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.lb td.r{text-align:right;font-family:var(--mono);
  font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12px}
table.lb td.pos{font:500 12px/1 var(--mono);color:var(--ink-3);width:58px;
  white-space:nowrap}
table.lb tr.pr:nth-child(-n+6) td.pos{color:var(--ink-2)}

.cs{display:flex;align-items:center;gap:9px;min-width:0}
.cs .pav{width:30px;height:30px;border-radius:3px;flex:none;display:grid;
  place-items:center;font:600 10px/1 var(--mono);
  background:var(--raised);color:var(--ink-2);border:1px solid var(--rule-2)}
/* Rank braid. One rule for all three chip sizes -- the SVG scales itself, so
   a Group Captain's four bars stay four bars at 24px and at 52px. */
.pav svg,.dw-id .av svg{display:block;width:76%;height:76%}
table.lb td.rk{font:500 10.5px/1 var(--mono);letter-spacing:.08em;
  color:var(--ink-2);white-space:nowrap}
.dw-id .rk{font:500 10px/1 var(--mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--amber);margin-top:6px}
.cs .nmw{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:500 13px/1.3 var(--ui);color:var(--ink)}
.caret{display:inline-block;width:8px;color:var(--ink-3);font-size:8px;
  transition:transform .14s ease}
tr.pr.open .caret{transform:rotate(90deg);color:var(--blue)}

.badge{font:500 8.5px/1 var(--mono);letter-spacing:.13em;padding:3px 6px;
  border-radius:2px;border:1px solid transparent;white-space:nowrap}
.badge.on{background:rgba(69,192,138,.14);color:var(--jade);
  border-color:rgba(69,192,138,.3)}
.badge.role{background:rgba(232,163,61,.13);color:var(--amber);
  border-color:rgba(232,163,61,.32)}
.badge.cmd{color:var(--ink-2);border-color:var(--rule-2)}
.badge.sb{color:var(--ink-2);border-color:var(--rule-2)}

/* ---------- expanded pilot record ---------- */
td.detcell{padding:0!important;background:rgba(10,14,20,.6);
  border-bottom:1px solid var(--rule-2)!important}
.pcard{padding:16px 18px 0 56px}
.phead{display:flex;gap:14px;align-items:flex-start}
.pname{font:600 15px/1.2 var(--ui);color:var(--ink);margin-bottom:7px}
.ppills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.pill2{font:500 9.5px/1 var(--mono);letter-spacing:.1em;padding:4px 8px;
  border:1px solid var(--rule-2);border-radius:2px;color:var(--ink-2)}
.pill2.b{border-color:rgba(76,143,232,.4);color:var(--blue)}
.pill2.r{border-color:rgba(217,69,92,.4);color:var(--rose)}
.pnote{font:400 12px/1.75 var(--ui);color:var(--ink-3);max-width:78ch}
.pnote b{color:var(--ink-2);font-weight:500}
.pstats{display:flex;margin:14px -18px 0 -56px;border-top:1px solid var(--rule)}
.pstats>div{flex:1;padding:11px 10px;text-align:center;border-right:1px solid var(--rule)}
.pstats>div:last-child{border-right:0}
.pstats b{display:block;font:600 15px/1 var(--mono);font-variant-numeric:tabular-nums;
  color:var(--ink)}
.pstats span{display:block;font:500 8.5px/1 var(--mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.prank{display:none}

/* ---------- operational log ---------- */
.tlk{display:flex;gap:18px;margin:0 0 14px;font:400 11px/1 var(--mono);color:var(--ink-3)}
.tlk i{display:inline-block;width:14px;height:2px;margin-right:7px;vertical-align:3px}
.tlwrap{border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px 10px;
  background:var(--slate)}
.tlwrap svg{width:100%;height:clamp(200px,32vh,320px);display:block}
.tlx{display:flex;justify-content:space-between;margin-top:9px;
  font:400 10px/1 var(--mono);color:var(--ink-3)}

.log{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.le{display:grid;grid-template-columns:62px 92px 1fr;gap:0;align-items:baseline;
  border-bottom:1px solid var(--rule);transition:background .14s ease}
.le:last-child{border-bottom:0}
.le:hover{background:rgba(76,143,232,.045)}
.le .lt{padding:8px 10px;font:400 10.5px/1.4 var(--mono);color:var(--ink-3);
  text-align:right;border-right:1px solid var(--rule)}
.le .lk{padding:8px 10px;font:500 9px/1.4 var(--mono);letter-spacing:.13em;
  text-transform:uppercase;border-right:1px solid var(--rule)}
.le .lx{padding:8px 12px;font:400 12px/1.45 var(--ui);color:var(--ink)}
.le.kill    .lk{color:var(--rose)}
.le.capture .lk{color:var(--blue)}
.le.trap    .lk{color:var(--amber)}
.le.join .lk,.le.leave .lk{color:var(--jade)}
.le .lk{color:var(--ink-3)}

/* ---------- mission support packages ---------- */
.req{border:1px solid rgba(232,163,61,.3);border-left:3px solid var(--amber);
  border-radius:var(--r);background:rgba(232,163,61,.06);padding:12px 15px;
  font:400 12px/1.65 var(--ui);color:var(--ink-2);margin-bottom:22px}
.req b{color:var(--amber);font-weight:600}
.dl{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.dlc{display:grid;grid-template-columns:1fr 150px 132px;gap:0;align-items:center;
  border-bottom:1px solid var(--rule);transition:background .14s ease}
.dlc:last-child{border-bottom:0}
.dlc:hover{background:rgba(76,143,232,.045)}
.dlc .meta{padding:12px 16px;min-width:0}
.dlc .n{font:600 13px/1.3 var(--ui);color:var(--ink)}
.dlc .d{font:400 11.5px/1.5 var(--ui);color:var(--ink-3);margin-top:3px}
.dlc .v{padding:12px 14px;font:500 11px/1.3 var(--mono);color:var(--ink-2);
  border-left:1px solid var(--rule);word-break:break-all}
.dlc .act{padding:12px 16px;border-left:1px solid var(--rule);text-align:right}
.dlc .act a{font:500 11px/1 var(--mono);letter-spacing:.09em;color:var(--blue);
  text-decoration:none;white-space:nowrap}
.dlc .act a:hover{text-decoration:underline}
.dlc .ask{font:400 10.5px/1.35 var(--mono);color:var(--ink-3)}

@media(max-width:820px){
  .pnl{padding:18px 14px 50px}
  table.lb .hide-s{display:none}
  .dlc{grid-template-columns:1fr}
  .dlc .v,.dlc .act{border-left:0;border-top:1px solid var(--rule);text-align:left}
  .le{grid-template-columns:56px 1fr}
  .le .lk{grid-column:2;border-right:0;padding-bottom:0}
  .le .lx{grid-column:2;padding-top:2px}
  .pcard{padding-left:18px}
  .pstats{margin-left:-18px}
}


/* ===================== PILOT OPERATIONS ===================== */
.pops{padding:22px 26px 80px;max-width:1520px;margin:0 auto;
  transition:padding-right .22s cubic-bezier(.4,0,.2,1)}
/* Wide screens have room to keep the roster fully visible beside the drawer. */
@media(min-width:1500px){
  #panel.drawered .pops{padding-right:436px;max-width:none}
}

/* page header: title left, operational context right */
.pop-head{display:flex;align-items:flex-end;justify-content:space-between;
  gap:24px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--rule-2)}
.pop-head h2{margin:0;font:600 17px/1.1 var(--ui);letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink)}
.pop-head .sub{margin:6px 0 0;font:400 12px/1.5 var(--ui);color:var(--ink-3)}
.pop-ctx{display:flex;gap:0;align-items:stretch;flex:none;
  border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pop-ctx div{padding:7px 13px;border-right:1px solid var(--rule);
  font:500 10.5px/1.3 var(--mono);color:var(--ink-2);white-space:nowrap}
.pop-ctx div:last-child{border-right:0}
.pop-ctx .k{display:block;font-size:8.5px;letter-spacing:.17em;color:var(--ink-3);
  text-transform:uppercase;margin-bottom:3px}
.pop-ctx .live{color:var(--jade)} .pop-ctx .dead{color:var(--rose)}

/* KPI strip: one continuous rule of figures, not six cards */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
  border:1px solid var(--rule);border-top:0;border-radius:0 0 var(--r) var(--r);
  background:var(--slate);margin-bottom:26px}
.kpi > div{padding:15px 18px;border-right:1px solid var(--rule)}
.kpi > div:last-child{border-right:0}
.kpi b{display:block;font:600 26px/1 var(--mono);font-variant-numeric:tabular-nums;
  color:var(--ink);letter-spacing:-.01em}
.kpi span{display:block;font:500 8.5px/1 var(--mono);letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-3);margin-top:8px}
.kpi .u{font-size:14px;color:var(--ink-3);margin-left:3px}
.kpi .air b{color:var(--jade)} .kpi .on b{color:var(--blue)}
.kpi .cmd b{color:var(--amber)}

/* two-column band: flight line beside readiness */
.pband{display:grid;grid-template-columns:1fr 400px;gap:22px;margin-bottom:26px;
  align-items:start}
@media(max-width:1280px){.pband{grid-template-columns:1fr}}

/* ---------- active flight line ---------- */
.fl{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.flrow{display:grid;grid-template-columns:auto 1fr repeat(3,minmax(96px,auto)) auto;
  gap:0 18px;align-items:center;padding:13px 16px;
  border-bottom:1px solid var(--rule);cursor:pointer;transition:background .16s ease}
.flrow:last-child{border-bottom:0}
.flrow:hover{background:rgba(76,143,232,.055)}
.flrow .f{min-width:0}
.flrow .fk{display:block;font:500 8.5px/1 var(--mono);letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.flrow .fv{display:block;font:500 12.5px/1.2 var(--mono);color:var(--ink);
  font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.flrow .cname{font:600 15px/1.2 var(--ui);color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flrow .crole{font:500 9.5px/1 var(--mono);letter-spacing:.13em;color:var(--ink-3);
  margin-top:5px;text-transform:uppercase}

/* ---------- readiness ---------- */
.rd{border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px}
.rdbar{display:flex;height:10px;border-radius:2px;overflow:hidden;
  background:var(--graphite);border:1px solid var(--rule);margin:4px 0 14px}
.rdbar i{transition:width .3s ease}
.rdbar i.air{background:var(--jade)}
.rdbar i.pit{background:var(--blue)}
.rdbar i.onl{background:var(--blue-dim)}
.rdbar i.stb{background:repeating-linear-gradient(135deg,var(--rule-2) 0 5px,var(--rule) 5px 10px)}
.rdkey{display:grid;gap:0}
.rdkey div{display:flex;align-items:center;gap:9px;padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,.035)}
.rdkey div:last-child{border-bottom:0}
.rdkey i{width:8px;height:8px;border-radius:2px;flex:none}
.rdkey .l{font:400 11.5px/1 var(--ui);color:var(--ink-2)}
.rdkey .d{font:400 10px/1 var(--mono);color:var(--ink-3);margin-left:auto;
  margin-right:10px}
.rdkey .n{font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums;
  color:var(--ink);min-width:22px;text-align:right}

/* ---------- roster controls ---------- */
.rct{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.psearch{position:relative;flex:1;min-width:210px;max-width:340px}
.psearch input{width:100%;background:var(--slate);border:1px solid var(--rule-2);
  border-radius:var(--r);padding:8px 11px 8px 30px;color:var(--ink);
  font:400 12px/1.3 var(--mono);letter-spacing:.04em}
.psearch input::placeholder{color:var(--ink-3);letter-spacing:.13em;font-size:10.5px}
.psearch input:focus{outline:none;border-color:var(--blue)}
.psearch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;stroke:var(--ink-3);fill:none;stroke-width:1.6}
.pfilt{display:flex;gap:5px;flex-wrap:wrap}
.pfilt button{font:500 9.5px/1 var(--mono);letter-spacing:.13em;padding:7px 10px;
  border:1px solid var(--rule-2);border-radius:var(--r);color:var(--ink-3);
  transition:all .16s ease}
.pfilt button:hover{color:var(--ink-2);border-color:var(--rule-hot)}
.pfilt button.on{color:var(--ink);border-color:var(--blue);background:rgba(76,143,232,.11)}
.rct .count{margin-left:auto;font:400 10.5px/1 var(--mono);color:var(--ink-3)}

/* ---------- roster ---------- */
/* Numeric columns are sized, not stretched: grouped on the right they can be
   compared by running the eye down, which is the whole point of a roster. */
.pops table.lb th.n,.pops table.lb td.n{width:104px}
.pops table.lb th.w,.pops table.lb td.w{width:132px}
.pops table.lb td.r,.pops table.lb th.r{padding-right:14px}

table.lb thead th.s{cursor:pointer;user-select:none}
table.lb thead th.s:hover{color:var(--ink-2)}
table.lb thead th .ar{opacity:0;margin-left:4px}
table.lb thead th.act{color:var(--ink)}
table.lb thead th.act .ar{opacity:1;color:var(--blue)}
table.lb tr.pr.sel td{background:rgba(76,143,232,.13);
  box-shadow:inset 2px 0 0 var(--blue)}

/* status pip: the one place a pulse is allowed, and only when airborne */
.st{display:inline-flex;align-items:center;gap:7px;font:500 9.5px/1 var(--mono);
  letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.st i{width:6px;height:6px;border-radius:50%;flex:none;background:var(--ink-3)}
.st.airborne{color:var(--jade)} .st.airborne i{background:var(--jade);
  animation:beat 2.4s ease-out infinite}
.st.cockpit{color:var(--blue)} .st.cockpit i{background:var(--blue)}
.st.online{color:var(--blue)} .st.online i{background:var(--blue-dim)}
.st.standby{color:var(--ink-3)} .st.standby i{background:var(--rule-2)}

/* avatar with a status ring: operational identifier, not a profile photo */
.pav{position:relative}
.pav.ring::after{content:'';position:absolute;inset:-3px;border-radius:6px;
  border:1px solid var(--ringc,transparent);pointer-events:none}

/* ---------- intelligence drawer ---------- */
#pdrawer{position:fixed;top:var(--hdrh);right:0;bottom:0;width:410px;z-index:900;
  background:var(--slate);border-left:1px solid var(--rule-2);
  box-shadow:-18px 0 48px rgba(0,0,0,.5);
  transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;display:flex;flex-direction:column}
#pdrawer.open{transform:translateX(0)}
@media(max-width:640px){#pdrawer{width:100%}}

.dw-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;
  justify-content:space-between;padding:11px 16px;background:var(--slate);
  border-bottom:1px solid var(--rule)}
.dw-top .eyebrow{color:var(--ink-2)}
.dw-x{width:26px;height:26px;display:grid;place-items:center;border-radius:var(--r);
  color:var(--ink-3);font-size:15px;line-height:1;transition:all .16s ease}
.dw-x:hover{color:var(--ink);background:var(--raised)}

.dw-id{display:flex;gap:14px;padding:18px 16px;border-bottom:1px solid var(--rule)}
.dw-id .av{width:52px;height:52px;border-radius:4px;flex:none;display:grid;
  place-items:center;font:600 18px/1 var(--mono);
  background:var(--raised);color:var(--ink-2);border:1px solid var(--rule-2)}
.dw-id .nm{font:600 19px/1.15 var(--ui);color:var(--ink);word-break:break-word}
.dw-id .rl{margin-top:7px}
.dw-id .stline{margin-top:9px}

.dw-sec{padding:14px 16px;border-bottom:1px solid var(--rule)}
.dw-sec h4{margin:0 0 10px;font:500 9px/1 var(--mono);letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3)}
.dw-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.dw-grid div{background:var(--slate);padding:11px 13px}
/* Odd tile counts left an empty cell; let the last one span the row. */
.dw-grid div:last-child:nth-child(odd){grid-column:span 2}
.dw-grid b{display:block;font:600 17px/1 var(--mono);font-variant-numeric:tabular-nums;
  color:var(--ink)}
.dw-grid span{display:block;font:500 8.5px/1 var(--mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);margin-top:6px}

.dw-kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,.035);font:400 12px/1.45 var(--ui)}
.dw-kv:last-child{border-bottom:0}
.dw-kv .k{color:var(--ink-3)}
.dw-kv .v{font:500 11.5px/1.45 var(--mono);color:var(--ink-2);text-align:right;
  font-variant-numeric:tabular-nums}

/* per-pilot activity: a timeline, so it reads as a sequence */
.dw-tl{position:relative;padding-left:15px}
.dw-tl::before{content:'';position:absolute;left:3px;top:5px;bottom:5px;width:1px;
  background:var(--rule-2)}
.dw-tl .ev{position:relative;padding:0 0 12px 0}
.dw-tl .ev:last-child{padding-bottom:0}
.dw-tl .ev::before{content:'';position:absolute;left:-15px;top:4px;width:7px;height:7px;
  border-radius:50%;background:var(--rule-2);border:2px solid var(--slate)}
.dw-tl .ev.kill::before{background:var(--rose)}
.dw-tl .ev.capture::before{background:var(--blue)}
.dw-tl .ev.trap::before{background:var(--amber)}
.dw-tl .ev.join::before,.dw-tl .ev.leave::before{background:var(--jade)}
.dw-tl .t{font:400 10px/1 var(--mono);color:var(--ink-3)}
.dw-tl .x{font:400 12px/1.45 var(--ui);color:var(--ink-2);margin-top:3px}

.dw-empty{font:400 11.5px/1.6 var(--ui);color:var(--ink-3);font-style:italic}

/* backdrop so the drawer reads as modal-ish without trapping the roster */
#pscrim{position:fixed;inset:0;z-index:880;background:rgba(6,9,13,.5);
  opacity:0;pointer-events:none;transition:opacity .22s ease}
#pscrim.on{opacity:1;pointer-events:auto}
@media(min-width:1100px){#pscrim{display:none}}

/* ---------- section rules on this page ---------- */
.pops .srule{margin:0 0 12px}

@media(max-width:820px){
  .pops{padding:16px 14px 70px}
  .kpi{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
  .kpi > div{padding:12px 13px}
  .kpi b{font-size:20px}
  .flrow{grid-template-columns:auto 1fr;gap:10px}
  .flrow .f{grid-column:2}
  .pop-ctx{width:100%}
}

</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
// ---------------------------------------------------------------------------
// SkyForge Mission Board.
//
// Static JSON from CloudFront, no API server. The DCS box publishes while it
// runs; when it sleeps the files stop changing, so every panel is driven from
// status.json's timestamp rather than assuming data means "live".
//
// Mission cards are derived from Pretense's own state: zones building a mission
// (currentMissionBuild) are ACTIVE, zones that could be pushed are AVAILABLE,
// and downed pilots in csarTracker become rescue tasks.
// ---------------------------------------------------------------------------
const DATA = './data/', POLL = 10000, STALE = 150;
const SIDE = {0:'#8b96a8', 1:'#ff4d4d', 2:'#4a9eff'};
const CATS = ['patrol','cas','sead','strike','assault','supply','csar'];

// Squadron appointments. Keyed by the exact DCS player name -- matched
// case-insensitively, because people re-type their name and capitalisation
// drifts. Add a line to give someone a title; nothing else needs changing.
//
// OVERLORD is the traditional NATO callsign for ground-based intercept
// control, which is the job rather than a nickname.
const ROLES = {
  'r00k': {tag:'OVERLORD', title:'Ground Control Intercept \u00b7 runs the radar picture and vectors the flight'},
};
const roleOf = n => ROLES[String(n||'').trim().toLowerCase()] || null;

// Indian Air Force commissioned ranks, lowest first. Rank is derived from the
// XP Pretense already writes and is never written back, so the mission file
// and the server are untouched.
//
// Each promotion costs more than the last until the ladder flattens out:
//
//   1,000 -> 5,000 -> 10,000 -> 24,000 -> then a flat 30,000 for the rest
//
// So the first rank is a night or two of flying, the middle of the ladder is
// real work, and the five air officer ranks all cost the same 30,000 apiece.
// Group Captain at 40,000 is the wall -- roughly twice what the squadron's
// strongest pilot has accumulated so far -- and senior rank is meant to be a
// season's work rather than a month's.
//
// Marshal of the Indian Air Force is deliberately absent. It is a five-star
// honour held once in the service's history, by Arjan Singh, and is not a
// thing to hand out for flight hours.
//
// braid follows the RAF pattern the IAF inherited: 2 = broad, 1 = medium,
// 0.5 = the thin bar that sits between a Squadron Leader's two mediums.
const RANKS=[
  {xp:      0, ab:'Fg Offr',  name:'Flying Officer',     braid:[1],         stars:0},
  {xp:   1000, ab:'Flt Lt',   name:'Flight Lieutenant',  braid:[1,1],       stars:0},
  {xp:   6000, ab:'Sqn Ldr',  name:'Squadron Leader',    braid:[1,0.5,1],   stars:0},
  {xp: 16000, ab:'Wg Cdr',   name:'Wing Commander',     braid:[1,1,1],     stars:0},
  {xp: 40000, ab:'Gp Capt',  name:'Group Captain',      braid:[1,1,1,1],   stars:0},
  // Air officers all wear the same single broad band; the star count is what
  // separates them, exactly as on the real boards.
  {xp: 70000, ab:'Air Cmde', name:'Air Commodore',      braid:[2],         stars:1},
  {xp:100000, ab:'AVM',      name:'Air Vice Marshal',   braid:[2],         stars:2},
  {xp:130000, ab:'Air Mshl', name:'Air Marshal',        braid:[2],         stars:3},
  {xp:160000, ab:'ACM',      name:'Air Chief Marshal',  braid:[2],         stars:4},
];

// Highest rank the pilot has reached, plus the next one up when there is one.
function rankOf(xp){
  const v=Math.max(0,+xp||0);
  let i=0;
  for(let k=0;k<RANKS.length;k++) if(v>=RANKS[k].xp) i=k;
  return {...RANKS[i], idx:i, next:RANKS[i+1]||null, toNext:RANKS[i+1]?RANKS[i+1].xp-v:0};
}

// The braid itself. Bars stack bottom-heavy and centre in a fixed box so
// every rank sits on the same optical baseline in a roster column.
// A five-point star, drawn small enough to sit on a shoulder board.
function starPath(cx,cy,r){
  let d='';
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.42:r;
    d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(2)+' '+(cy+rr*Math.sin(a)).toFixed(2);
  }
  return d+'Z';
}

// The shoulder board itself, drawn rather than photographed.
//
// The insignia are reproduced as vectors because the board is a single HTML
// file served from S3: nine bitmaps would mean nine data URIs and tens of KB
// for something that has to stay sharp at 30px in a roster row and 52px in the
// drawer. Vectors cost a few hundred bytes and never blur.
//
// Junior officers wear plain braid; air officers add the star row and the brass
// device, which is the real distinction in the service. One deliberate
// departure from the physical board: a Squadron Leader's middle stripe is full
// width in life, but at 30px its lesser HEIGHT anti-aliases away and the rank
// becomes indistinguishable from a Wing Commander -- so it is narrowed instead.
// Silhouette survives downscaling where weight does not.
function braidSvg(braid,stars){
  const BW=12, BX=6, BY=1.5, BH=21;          // the board
  const SW=9,  SX=7.5, NARROW=4.5;           // braid stripes
  const MED=1.5, BROAD=2.6, THIN=1.1, GAP=1.3;
  stars=stars||0;

  const hs=braid.map(w=>w===2?BROAD:w===1?MED:THIN);
  const tot=hs.reduce((a,b)=>a+b,0)+GAP*(hs.length-1);
  let y=20.4-tot;                             // stack upward from the base
  const bars=hs.map((h,k)=>{
    const w=braid[k]===0.5?NARROW:SW, x=SX+(SW-w)/2;
    const r=`<rect x="${x}" y="${y.toFixed(2)}" width="${w}" height="${h.toFixed(2)}" rx=".4" fill="var(--iaf-braid)"/>`;
    y+=h+GAP; return r;
  }).join('');

  let device='';
  if(stars){
    // Brass device below the stars, standing in for the national emblem. At
    // roster size an accurate lion capital is a smudge, so it reads as the
    // one warm mark on an otherwise cool board.
    device+=`<circle cx="12" cy="12.4" r="1.7" fill="var(--iaf-gold)"/>`
          + `<rect x="10.4" y="14.5" width="3.2" height="0.9" rx=".3" fill="var(--iaf-gold)"/>`;
    const R=0.95, STEP=2.15, x0=12-(stars-1)*STEP/2;
    for(let i=0;i<stars;i++)
      device+=`<path d="${starPath(x0+i*STEP,6.2,R)}" fill="var(--iaf-braid)"/>`;
  }

  return `<svg viewBox="0 0 24 24" aria-hidden="true">`
       + `<rect x="${BX}" y="${BY}" width="${BW}" height="${BH}" rx="2"`
       + ` fill="var(--iaf-board)" stroke="var(--rule-2)" stroke-width=".6"/>`
       + device + bars + `</svg>`;
}
let view = 'list', active = new Set(CATS);

// Controller mode: contact labels + the intel panel. Remembered per browser so
// whoever runs GCI does not re-enable it every visit. Storage can throw
// outright in a private window, so never let it stop the page rendering.
let intel = (() => { try { return localStorage.getItem('sf-intel') === '1'; }
                     catch(e) { return false; } })();
let D = {status:null, campaign:null, live:null, pilots:null, history:null, zones:null,
         seen:null, combat:null, kd:null, feed:null};

const $ = s => document.querySelector(s);
// Pilot names are attacker-controlled text rendered into innerHTML. Escape.
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c;
  if(h!==undefined)e.innerHTML=h; return e; };

// --- map -------------------------------------------------------------------
const map = L.map('map',{zoomControl:true,preferCanvas:true}).setView([42.6,42.0],7);

// Cursor position and zoom, the way any real chart tool reports them. Written
// straight to textContent on mousemove -- no re-render, no layout thrash.
if(map.on){
  const fmt = (v,pos,neg) => `${Math.abs(v).toFixed(4)}\u00b0${v>=0?pos:neg}`;
  map.on('mousemove', e => {
    const n = $('#hudLL');
    if(n) n.textContent = `${fmt(e.latlng.lat,'N','S')}  ${fmt(e.latlng.lng,'E','W')}`;
  });
  const zoomOut = () => { const n=$('#hudZ'); if(n) n.textContent = 'z'+map.getZoom(); };
  map.on('zoomend', zoomOut); map.on('load', zoomOut);
}
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OSM &copy; CARTO',subdomains:'abcd',maxZoom:18}).addTo(map);
const gZones=L.layerGroup().addTo(map), gUnits=L.layerGroup().addTo(map),
      gTrk=L.layerGroup().addTo(map);
let mapReady=false;

// Affine transform from DCS metres to lat/lon, solved from the reference points
// the export hook publishes. Pretense stores raw metres, so without this its
// zones and downed pilots cannot be placed at all.
// DCS metres -> lat/lon, exact inverse transverse Mercator.
//
// The constants come from the terrain itself (pydcs generates them from DCS)
// and ride along in zones.json, so this needs no reference points and no live
// server. Validated against six Caucasus airfields: worst error 0.75 km, best
// 0.03 km -- and those residuals are zone-centre vs airport reference point,
// not projection error.
//
// DCS axis order is the trap: mission x is NORTHING, z is EASTING. Swapping
// them mirrors the map into the Black Sea.
const WGS_A = 6378137.0, WGS_F = 1/298.257223563;
const WGS_E2 = WGS_F*(2-WGS_F), WGS_EP2 = WGS_E2/(1-WGS_E2);

function dcsLL(x, z){
  const p = D.zones && D.zones.proj;
  if(!p || !isFinite(x) || !isFinite(z)) return null;

  const E = z - p.x0, N = x - p.y0, k0 = p.k0;
  const e1 = (1-Math.sqrt(1-WGS_E2))/(1+Math.sqrt(1-WGS_E2));
  const mu = (N/k0)/(WGS_A*(1 - WGS_E2/4 - 3*WGS_E2**2/64 - 5*WGS_E2**3/256));

  const phi1 = mu
    + (3*e1/2 - 27*e1**3/32)*Math.sin(2*mu)
    + (21*e1**2/16 - 55*e1**4/32)*Math.sin(4*mu)
    + (151*e1**3/96)*Math.sin(6*mu)
    + (1097*e1**4/512)*Math.sin(8*mu);

  const sp = Math.sin(phi1), cp = Math.cos(phi1), tp = Math.tan(phi1);
  const C1 = WGS_EP2*cp*cp, T1 = tp*tp;
  const N1 = WGS_A/Math.sqrt(1 - WGS_E2*sp*sp);
  const R1 = WGS_A*(1-WGS_E2)/Math.pow(1 - WGS_E2*sp*sp, 1.5);
  const d = E/(N1*k0), d2 = d*d, d4 = d2*d2, d6 = d4*d2;

  const lat = phi1 - (N1*tp/R1)*(d2/2
    - (5 + 3*T1 + 10*C1 - 4*C1*C1 - 9*WGS_EP2)*d4/24
    + (61 + 90*T1 + 298*C1 + 45*T1*T1 - 252*WGS_EP2 - 3*C1*C1)*d6/720);
  const lon = p.lon0*Math.PI/180 + (d
    - (1 + 2*T1 + C1)*d*d2/6
    + (5 - 2*C1 + 28*T1 - 3*C1*C1 + 8*WGS_EP2 + 24*T1*T1)*d*d4/120)/cp;

  const out = [lat*180/Math.PI, lon*180/Math.PI];
  return (isFinite(out[0]) && isFinite(out[1])) ? out : null;
}

// Pretense stores {x, y, z} with y as altitude.
const toLL = p => !p ? null : dcsLL(p.x, p.z);

// --- helpers ---------------------------------------------------------------
const ago = s => s<60?`${Math.round(s)}s`:s<3600?`${Math.round(s/60)}m`:
  s<86400?`${Math.round(s/3600)}h`:`${Math.round(s/86400)}d`;
const mmss = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const grab = async n => { try{ const r=await fetch(DATA+n,{cache:'no-store'});
  return r.ok? await r.json():null; }catch{ return null; } };

function catOf(name){
  const s=(name||'').toLowerCase();
  for(const c of ['cas','sead','strike','assault','supply','patrol']) if(s.includes(c)) return c;
  return 'patrol';
}
// Hours read better than minutes once someone has a few sessions in.
const flown = m => !m ? null : m < 90
  ? `${Math.round(m)} min` : `${(m/60).toFixed(1)} h`;

const stars = n => '★'.repeat(n)+'<span style="color:#333">'+'★'.repeat(4-n)+'</span>';

// --- derive missions from Pretense state -----------------------------------
function missions(){
  const c=D.campaign; if(!c) return {avail:[],act:[]};
  const avail=[], act=[];

  Object.values(c.zones||{}).forEach(z=>{
    if(z.currentMissionBuild){
      const m=z.currentMissionBuild;
      act.push({id:m.name, cat:catOf(m.name), zone:z.name, side:m.side,
        desc:`Building ${m.name.replace(/-/g,' ')} at ${z.name}`,
        prog:Math.min(100,m.progress), diff:2, xp:Math.round(m.progress*8)});
    }
    // A contested blue-adjacent zone is something players can actually act on.
    if(z.distToFront<=2 && z.side!==0){
      avail.push({id:z.name.toLowerCase(), cat: z.side===1?'strike':'patrol',
        zone:z.name, side:z.side,
        desc: z.side===1 ? `Capture ${z.name} — ${z.distToFront} zones from the front`
                         : `Defend ${z.name} — enemy ${Math.round(z.closestEnemyDist/1000)} km out`,
        diff: Math.max(1,Math.min(4,5-z.distToFront)),
        xp: 200+Math.round((z.resource||0)/200), res:z.resource});
    }
  });

  Object.values(c.csarTracker||{}).forEach(p=>{
    avail.push({id:p.name, cat:'csar', zone:'downed pilot', side:2,
      desc:`Rescue ${p.name} and return them to a friendly zone`,
      diff:3, xp:500, timer:p.remainingTime, pos:p.pos});
  });

  // Ground squads waiting for a lift. These only became flyable work when the
  // Hercules and UH-60 went on the server, and Pretense already tracks them
  // with a countdown.
  Object.values(c.squadTracker||{}).forEach(q=>{
    if(q.state!=='extractReady') return;
    avail.push({id:q.name, cat:'supply', zone:'field extraction', side:q.side||2,
      desc:`Extract ${q.type||'squad'} team ${q.name} — needs a transport`,
      diff:2, xp:300, timer:q.remainingStateTime, pos:q.position});
  });

  return {avail, act};
}

// --- render ----------------------------------------------------------------
function card(m, isActive, lineNo){
  const c=el('div','mc '+(m.side===1?'red':m.side===2?'blue':'')+(isActive?' act':''));
  const pct = isActive ? Math.max(0,Math.min(100,m.prog||0)) : 0;
  if(isActive && pct>=100) c.classList.add('done');

  // Threat as four ticks rather than stars: stars read as a rating, and this
  // is a threat assessment. Filled ticks are amber because threat is the one
  // thing in this list that warrants attention colour.
  const thr=[0,1,2,3].map(i=>`<i class="${i<(m.diff||0)?'f':''}"></i>`).join('');

  // Right-hand block, fixed order so it lines up down the column.
  const aux = m.timer ? `<span class="aux">${mmss(m.timer)}</span>`
            : m.res   ? `<span class="aux">${Math.round(m.res/1000)}k res</span>`
            : '<span class="aux"></span>';
  if(m.timer && m.timer < 600) c.classList.add('urgent');

  c.innerHTML=`
    <span class="tno">${String(lineNo).padStart(3,'0')}</span>
    <div class="mid">
      <div class="top">
        <span class="cat">${esc(m.cat.toUpperCase())}</span>
        <span class="obj">${esc(m.zone)}</span>
      </div>
      <div class="desc">${esc(m.desc)}</div>
    </div>
    <div class="right">
      <span class="thr" title="Threat ${m.diff||0} of 4">${thr}</span>
      <span class="xp">+${m.xp} XP</span>
      ${isActive ? `<span class="pct">${pct.toFixed(0)}%</span>` : aux}
    </div>
    ${isActive ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}`;
  return c;
}

function renderList(){
  const {avail,act}=missions();
  const a=avail.filter(m=>active.has(m.cat)), b=act.filter(m=>active.has(m.cat));
  const L=$('#list'); L.innerHTML='';

  const mk=(title,arr,isAct,emptyMsg)=>{
    const col=el('div','col');
    const h=el('div','colhead');
    h.innerHTML=`<h3>${title}</h3><span class="n">${String(arr.length).padStart(2,'0')}</span>
                 <span class="rule"></span>`;
    col.appendChild(h);
    if(!arr.length){
      // An empty column should say what would fill it, not just sit blank.
      col.appendChild(el('div','empty',
        `<b>No ${title.toLowerCase()} tasking</b>${emptyMsg}`));
    }
    arr.forEach((m,i)=>col.appendChild(card(m,isAct,i+1)));
    return col;
  };

  L.appendChild(mk('Available',a,false,
    active.size<CATS.length ? 'Some categories are filtered out.'
                            : 'Pretense generates tasking as the front moves.'));
  L.appendChild(mk('Active',b,true,
    'Nothing is being built right now.'));
}

function renderMap(gci){
  gZones.clearLayers(); gUnits.clearLayers(); gTrk.clearLayers();
  const live=D.live, c=D.campaign;
  const bases=(live&&live.world&&live.world.bases)||[];
  const byName={}; bases.forEach(b=>byName[b.n.toLowerCase()]=b);

  // Zone positions, in order of trust:
  //   1. the live airbase, when gRPC is running and the names match
  //   2. zones.json, derived offline from the mission's own trigger zones
  //
  // (2) is why the map works at all with the server asleep, and why zones that
  // are not airbases -- Alpha, Oil Fields, Distillery -- can be drawn.
  const zpos=(D.zones&&D.zones.zones)||{};
  const placed=[];

  if(c) Object.values(c.zones||{}).forEach(z=>{
    const b=byName[(z.name||'').toLowerCase()];
    const fallback=zpos[z.name];
    const ll = b ? [b.lat,b.lon] : (Array.isArray(fallback)?fallback:null);
    if(!ll) return;
    placed.push(ll);
    L.circleMarker(ll,{radius:z.distToFront<=1?9:6,color:SIDE[z.side],weight:2,
      fillColor:SIDE[z.side],fillOpacity:.35})
      .bindPopup(`<b>${z.name}</b><br>${z.side===2?'BLUE':z.side===1?'RED':'neutral'}<br>
        resources ${Math.round((z.resource||0)/1000)}k · ${z.distToFront} from front`)
      .addTo(gZones);
  });

  // Contested zones (distToFront <= 1) get a halo, so the front reads at a
  // glance instead of having to compare 61 dot colours.
  if(c) Object.values(c.zones||{}).forEach(z=>{
    if((z.distToFront??9) > 1) return;
    const b=byName[(z.name||'').toLowerCase()];
    const fb=zpos[z.name];
    const ll = b ? [b.lat,b.lon] : (Array.isArray(fb)?fb:null);
    if(!ll) return;
    L.circleMarker(ll,{radius:15,color:SIDE[z.side],weight:1,opacity:.35,
      fill:false,dashArray:'3 4'}).addTo(gZones);
  });

  if(c) Object.values(c.csarTracker||{}).forEach(p=>{
    const ll=toLL(p.pos); if(!ll) return;
    L.circleMarker(ll,{radius:7,color:'#3fd07a',weight:2,fillOpacity:.5})
      .bindPopup(`<b>${p.name}</b><br>downed pilot · ${mmss(p.remainingTime)} left`).addTo(gZones);
  });

  // Everything below comes from the campaign save, so the map is populated
  // whether or not DCS-gRPC is running. Positions are up to ~60s old --
  // Pretense's save interval -- which the footer says out loud.
  const AIR = {tanker:'TKR', awacs:'AWACS', strike:'STRIKE', cap:'CAP',
               patrol:'CAP', supply_air:'SUPPLY', assault:'ASSAULT',
               transport:'TRANSPORT', csar:'CSAR'};

  Object.values((c&&c.activeGroups)||{}).forEach(g=>{
    const ll=toLL(g.position); if(!ll) return;
    const side = /-blue(-|$)/.test(g.productName||'') ? 2
               : /-red(-|$)/.test(g.productName||'') ? 1 : 0;
    const air = (g.position.y||0) > 150;
    const label = AIR[g.type] || (g.type||'').toUpperCase().slice(0,8);
    L.circleMarker(ll,{radius:air?5:4,color:SIDE[side],weight:air?2:1,
      fillColor:SIDE[side],fillOpacity:air?.85:.4})
      .bindPopup(`<b>${esc(label)}</b><br>${esc(g.productName||'')}<br>
        ${esc(g.homeName||'?')} &rarr; ${esc(g.targetName||'?')}<br>
        ${air?Math.round(g.position.y)+' m':'on the ground'}`)
      .addTo(gUnits);
    if(gci && air){
      L.marker(ll,{icon:L.divIcon({className:'',iconAnchor:[-7,6],
        html:`<div class="trk" style="color:${SIDE[side]}">${esc(label)}<br>FL${
          String(Math.round(g.position.y*3.28/100)).padStart(3,'0')}</div>`})})
        .addTo(gTrk);
    }
  });

  // Ground squads: the ones marked extractReady are a job for a transport.
  Object.values((c&&c.squadTracker)||{}).forEach(q=>{
    const ll=toLL(q.position); if(!ll) return;
    const ready = q.state==='extractReady';
    L.circleMarker(ll,{radius:ready?7:4,color:ready?'#ffc848':SIDE[q.side||0],
      weight:ready?2:1,fillOpacity:ready?.6:.25})
      .bindPopup(`<b>${esc(q.type||'squad')}</b> ${esc(q.name)}<br>
        ${esc(q.state||'')}<br>${mmss(q.remainingStateTime||0)} left`)
      .addTo(gZones);
  });

  Object.values((c&&c.carriers)||{}).forEach(cv=>{
    const ll = toLL(cv.position && cv.position.p); if(!ll) return;
    L.circleMarker(ll,{radius:8,color:'#4a9eff',weight:2,fillColor:'#0b1520',
      fillOpacity:.9})
      .bindPopup(`<b>${esc(cv.name)}</b><br>${(cv.aliveGroupMembers||[]).length} hull(s)<br>
        ${Math.round((cv.resource||0)/1000)}k resources`)
      .addTo(gZones);
  });

  const units=(live&&live.world&&live.world.units)||[];
  units.forEach(u=>{
    const col=SIDE[u.c]||SIDE[0], isP=!!u.p;
    L.circleMarker([u.lat,u.lon],{radius:isP?6:3,color:isP?'#ffb020':col,
      weight:isP?2:1,fillColor:col,fillOpacity:.8})
      .bindPopup(`<b>${isP?u.p:u.t}</b><br>${u.t}<br>${u.alt} m`).addTo(gUnits);
    if(gci&&u.cat<=1){
      L.marker([u.lat,u.lon],{icon:L.divIcon({className:'',iconAnchor:[-7,6],
        html:`<div class="trk" style="color:${col}">${isP?u.p:u.t}<br>FL${String(Math.round(u.alt*3.28/100)).padStart(3,'0')}</div>`})})
        .addTo(gTrk);
    }
  });

  if(!mapReady){
    const pts=[...placed,...bases.map(b=>[b.lat,b.lon]),...units.map(u=>[u.lat,u.lon])];
    if(pts.length){
      // Reserve room for the intel panel, or the eastern zones sit underneath it.
      map.fitBounds(L.latLngBounds(pts).pad(.15),
        gci ? {paddingBottomRight:[320,0]} : undefined);
      mapReady=true;
    }
  }
}

// The GCI view is a controller's station, not just a map with labels: what is
// contested, who is airborne, who needs picking up. All of it comes from the
// campaign save, so it works with the server asleep.
// The event feed is the only thing on this board that is genuinely real-time:
// it comes from a persistent gRPC stream, not a 15s poll of a save file.
function feedRows(n){
  const f = (D.feed && D.feed.feed) || [];
  if(!f.length) return '<div class="none">nothing yet this session</div>';
  return f.slice(0, n).map(e=>`<div class="fe ${esc(e.k)}">
    <span class="ft">${ago(Date.now()/1000 - e.ts)}</span>
    <span class="fk">${esc(String(e.k).toUpperCase())}</span>
    <span class="fx">${esc(e.t)}</span></div>`).join('');
}

function renderGci(){
  const c=D.campaign; const el=$('#gci');
  if(!c){ el.innerHTML='<div class="none">No campaign data.</div>'; return; }

  const zones=Object.values(c.zones||{});
  const blue=zones.filter(z=>z.side===2).length;
  const red=zones.filter(z=>z.side===1).length;
  const neutral=zones.filter(z=>z.side===0).length;

  const rows=(arr,empty)=>arr.length?arr.join(''):`<div class="none">${empty}</div>`;
  const sect=(t,n)=>`<h3>${t}${n!==undefined?`<em>${n}</em>`:''}</h3>`;

  const pri=Object.values((c.battlefieldManager&&c.battlefieldManager.priorityZones)||{});
  const ovr=(c.battlefieldManager&&c.battlefieldManager.overridePriorityZones)||[];
  const priList=[...ovr,...pri].filter(Boolean);

  const front=zones.filter(z=>(z.distToFront??9)<=1)
    .sort((a,b)=>(a.closestEnemyDist||0)-(b.closestEnemyDist||0));

  const air=Object.values(c.activeGroups||{}).filter(g=>(g.position&&g.position.y||0)>150);
  const byType={};
  air.forEach(g=>{ const t=(g.type||'other'); byType[t]=(byType[t]||0)+1; });
  const airBlue=air.filter(g=>/-blue(-|$)/.test(g.productName||'')).length;
  const airRed=air.filter(g=>/-red(-|$)/.test(g.productName||'')).length;

  const csar=Object.values(c.csarTracker||{}).sort((a,b)=>a.remainingTime-b.remainingTime);
  const squads=Object.values(c.squadTracker||{}).filter(q=>q.state==='extractReady')
    .sort((a,b)=>a.remainingStateTime-b.remainingStateTime);
  const carriers=Object.values(c.carriers||{});
  const srs=(D.live&&D.live.env&&D.live.env.srs)||[];

  el.innerHTML=`
    <div class="pic">
      <div class="b"><b>${airBlue}</b><span>Friendly</span></div>
      <div class="r"><b>${airRed}</b><span>Hostile</span></div>
      <div class="n"><b>${air.length-airBlue-airRed}</b><span>Unknown</span></div>
    </div>

    ${sect('Territory')}
    <div class="row"><span class="nm">
      <span class="dot" style="background:var(--blue)"></span>Blue held</span>
      <span class="rt">${blue}</span></div>
    <div class="row"><span class="nm">
      <span class="dot" style="background:var(--rose)"></span>Red held</span>
      <span class="rt">${red}</span></div>
    <div class="row"><span class="nm">
      <span class="dot" style="background:var(--neutral)"></span>Neutral</span>
      <span class="rt">${neutral}</span></div>

    ${sect('Priority objectives')}
    ${rows(priList.map(n=>`<div class="row"><span class="nm">${esc(n)}</span></div>`),
           'None nominated')}

    ${sect('Contested', front.length)}
    ${rows(front.map(z=>`<div class="row">
        <span class="nm"><span class="dot" style="background:${SIDE[z.side]}"></span>${esc(z.name)}</span>
        <span class="rt">${Math.round((z.closestEnemyDist||0)/1000)} km</span></div>`),
        'Front is quiet')}

    ${sect('Air activity', air.length)}
    ${rows(Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,n])=>
        `<div class="row"><span class="nm">${esc(t.replace(/_/g,' '))}</span>
         <span class="rt">${n}</span></div>`), 'Nothing airborne')}

    ${sect('On the radio', srs.length)}
    ${rows(srs.map(x=>`<div class="row"><span class="nm">${esc(x.n)}</span>
        <span class="rt">${x.f?(x.f/1e6).toFixed(3):''}</span></div>`), 'No SRS clients')}

    ${sect('CSAR', csar.length)}
    ${rows(csar.map(p=>`<div class="row"><span class="nm">${esc(p.name)}</span>
        <span class="rt ${p.remainingTime<600?'warn':''}">${mmss(p.remainingTime)}</span>
      </div>`), 'No downed pilots')}

    ${sect('Awaiting pickup', squads.length)}
    ${rows(squads.map(q=>`<div class="row">
        <span class="nm">${esc(q.type||'squad')} &middot; ${esc(q.name)}</span>
        <span class="rt ${q.remainingStateTime<600?'warn':''}">${mmss(q.remainingStateTime)}</span>
      </div>`), 'None waiting')}

    ${sect('Naval')}
    ${rows(carriers.map(cv=>`<div class="row"><span class="nm">${esc(cv.name)}</span>
        <span class="rt">${Math.round((cv.resource||0)/1000)}k</span></div>`), 'No carriers')}

    ${sect('Recent activity')}
    <div class="feed">${feedRows(14)}</div>`;
}

// The HUD corners. Kept separate from mapNote() so the trust indicator can
// update on every poll without touching the source line.
function renderHud(){
  const z = Object.keys((D.zones&&D.zones.zones)||{}).length;
  const c = D.campaign, zs = Object.values((c&&c.zones)||{});
  const t = $('#hudTheatre'); if(t) t.textContent = (D.zones&&D.zones.theatre)||'Caucasus';
  const zz = $('#hudZones');
  if(zz) zz.textContent = zs.length ? `${zs.length} zones \u00b7 ${z} mapped` : `${z} mapped`;

  // Three states, because "live" and "a minute old" are different promises.
  // Player positions are real-time via gRPC; AI positions come from the
  // campaign save and are up to a minute behind. Saying so is the point.
  const st = D.status, age = st ? Date.now()/1000 - st.ts : 1e9;
  const on = st && st.online && age < STALE;
  const fs = $('#feedState');
  if(fs){
    const cls = !on ? 'dead' : age > 60 ? 'lag' : 'live';
    const txt = !on ? 'No feed' : age > 60 ? `Lagging ${ago(age)}` : 'Live';
    fs.className = `hudbox feedstate ${cls}`;
    fs.innerHTML = `<span class="beat ${on?'on':'off'}"></span><span>${txt}</span>`;
  }
}

// A map should say what it is showing, rather than leaving gaps to be guessed at.
function mapNote(){
  const st=D.status, age=st?Date.now()/1000-st.ts:1e9;
  const on=st&&st.online&&age<STALE;
  const zn=Object.keys((D.zones&&D.zones.zones)||{}).length;
  const players=((D.live&&D.live.world&&D.live.world.units)||[]).length;
  const ai=Object.values((D.campaign&&D.campaign.activeGroups)||{})
    .filter(g=>(g.position&&g.position.y||0)>150).length;

  const bits=[];
  if(!zn){ bits.push('Zone positions unavailable'); }
  else {
    bits.push(`${zn} zones mapped`);
    // Say where each number comes from and how old it is. A map that implies
    // live tracking when it is a minute behind is worse than no map.
    if(ai) bits.push(`${ai} AI contacts from the campaign feed (~1 min old)`);
    if(players) bits.push(`${players} player aircraft, live`);
    else if(on) bits.push('player positions need DCS-gRPC');
    if(!on) bits.push('server offline \u2014 last known picture');
  }
  const el=$('#mapnote'); if(el) el.textContent=bits.join('  \u00b7  ');
}

// Weather as a pilot actually reads it: one instrument line, not four widgets.
//
//   230908Z 18000KT 17C Q1001
//
// Wind is converted to knots because that is the unit on every kneeboard and
// every ATIS; DCS reports metres per second. Calm renders 00000KT, which is
// the real notation -- a pilot reads that instantly and it beats inventing a
// word for it. Values DCS does not supply are omitted rather than zeroed: a
// blank temperature shown as 0C is a lie, and this is flight data.
function envChips(){
  const e = D.live && D.live.env;
  if(!e) return '';

  const p2 = n => String(n).padStart(2,'0');
  const p3 = n => String(n).padStart(3,'0');
  const bits = [];

  // Day-of-month + mission time, Zulu. The Z is not decoration -- mission time
  // is what briefings are written against, and it is not the wall clock.
  if(e.day) bits.push(`<b>${p2(e.day)}${p2(e.hh??0)}${p2(e.mm??0)}Z</b>`);
  else      bits.push(`<b>${p2(e.hh??0)}${p2(e.mm??0)}Z</b>`);

  const kt = Math.round((e.windMs||0) * 1.94384);
  bits.push(`<b>${p3(e.windDir||0)}${p2(kt)}KT</b>`);

  if(e.tempC !== null && e.tempC !== undefined) bits.push(`<b>${Math.round(e.tempC)}C</b>`);
  if(e.qnh) bits.push(`<b>Q${e.qnh}</b>`);

  return `<div class="cell metar" title="Mission time (Zulu), surface wind, temperature, QNH">
    ${bits.join(' ')}</div>`;
}

// The floating header is not a fixed height. It grows with content (mission
// tabs, status chips) and with viewport width, because #ctl is flex-wrap:wrap
// -- adding the Pilots/History/Files buttons made it wrap one row sooner on a
// narrow window. #main clears the header with padding, so that number cannot
// be a constant: when it was, panels slid underneath it.
function syncHeaderHeight(){
  const el = $('#hdr');
  if(!el || typeof el.getBoundingClientRect !== 'function') return;
  const root = document.documentElement;
  if(!root || !root.style || !root.style.setProperty) return;
  // 12px because #hdr is inset from the top, plus 12px of breathing room.
  const h = Math.ceil(el.getBoundingClientRect().height) + 24;
  if(h > 0) root.style.setProperty('--hdrh', h + 'px');
}
