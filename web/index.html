// --- Pilots -----------------------------------------------------------------
//
// Pretense's player_stats.json is Lua-shaped, so two things bite here: a
// player with no stats yet serialises as an empty ARRAY rather than an object,
// and the online roster uses DCS display names that must be matched against
// these keys exactly.

function pilotRows(){
  const st=(D.pilots&&D.pilots.stats)||{};
  const online=new Set(((D.status&&D.status.names)||[]).map(n=>
    typeof n==='object'?n.n:n));
  return Object.entries(st).map(([name,v])=>{
    const o = (v && typeof v==='object' && !Array.isArray(v)) ? v : {};
    const live=((D.status&&D.status.names)||[]).find(x=>
      (typeof x==='object'?x.n:x)===name);
    const slot=(((D.pilots&&D.pilots.players)||[]).find(p=>p.name===name)||{}).unit;
    return {name, xp:+o.XP||0, cmd:+o.CMD||0, sb:+o.SB||0, on:online.has(name),
            role:roleOf(name), side:live&&typeof live==='object'?+live.s||0:0,
            unit:slot||null, cfg:((D.pilots&&D.pilots.config)||{})[name]||null,
            cb:((D.combat&&D.combat.pilots)||{})[name]||null,
            kd:((D.kd&&D.kd.pilots)||{})[name]||null};
  }).sort((a,b)=>b.xp-a.xp);
}



// ===================== PILOT OPERATIONS =====================

// View state. Kept outside the render so a poll never resets what the
// operator has typed or chosen.
let pQuery='', pFilter='all', pSort='status', pDesc=true, pSel=null, pShell=false;

// Status is derived, never stored. Order matters: the first match wins, and
// they run most-operational first.
//
//   airborne  a player unit exists in the gRPC feed above 150 m
//   cockpit   occupying an aircraft slot but not up yet
//   online    connected without a slot -- slotting or spectating
//   standby   has flown here before, not connected now
function pilotStatus(r){
  if(r.airborne) return 'airborne';
  if(r.on && r.unit) return 'cockpit';
  if(r.on) return 'online';
  return 'standby';
}
const ST_LABEL={airborne:'Airborne',cockpit:'In cockpit',online:'Online',standby:'Standby'};
const ST_ORDER={airborne:0,cockpit:1,online:2,standby:3};

// Everything the page knows about one pilot, assembled from the five feeds.
function pilotRecords(){
  const rows=pilotRows();
  // live.json carries player units with an altitude; that is the only honest
  // way to tell airborne from sitting on the ramp.
  const air={};
  ((D.live&&D.live.world&&D.live.world.units)||[]).forEach(u=>{
    if(u.p) air[u.p]={alt:u.alt||0};
  });
  return rows.map(r=>{
    const sn=(D.seen||{})[r.name]||null;
    const a=air[r.name];
    const rec=Object.assign({},r,{
      seen:sn,
      airborne:!!(a && (a.alt||0)>150),
      alt:a?a.alt:null,
      minutes:sn?sn.minutes:0,
      sessions:sn?sn.sessions:0,
      last:sn?sn.last:0,
      first:sn?sn.first:0,
    });
    rec.status=pilotStatus(rec);
    return rec;
  });
}

function pilotCounts(recs){
  const c={airborne:0,cockpit:0,online:0,standby:0,command:0};
  recs.forEach(r=>{ c[r.status]++; if(r.role||r.cmd) c.command++; });
  c.connected=c.airborne+c.cockpit+c.online;
  c.total=recs.length;
  return c;
}

function setPilotView(o){
  if(o.q      !== undefined) pQuery  = o.q;
  if(o.filter !== undefined) pFilter = o.filter;
  if(o.desc   !== undefined) pDesc   = o.desc;
  if(o.sort   !== undefined){
    // Clicking the active column flips direction; a new column starts descending.
    if(pSort === o.sort && o.desc === undefined) pDesc = !pDesc;
    else if(pSort !== o.sort) pDesc = true;
    pSort = o.sort;
  }
  renderPilotRoster(pilotRecords());
}

function filterPilots(recs){
  const q=pQuery.trim().toLowerCase();
  return recs.filter(r=>{
    if(pFilter==='connected' && r.status==='standby') return false;
    if(pFilter==='airborne'  && r.status!=='airborne') return false;
    if(pFilter==='command'   && !(r.role||r.cmd)) return false;
    if(!q) return true;
    // Search covers the things an operator would actually type.
    return r.name.toLowerCase().includes(q)
        || (r.role && (r.role.tag+' '+r.role.title).toLowerCase().includes(q))
        || (r.unit && r.unit.toLowerCase().includes(q))
        || ST_LABEL[r.status].toLowerCase().includes(q);
  });
}

function sortPilots(recs){
  const dir=pDesc?-1:1;
  const num=(v)=>typeof v==='number'&&isFinite(v)?v:-1;
  const by={
    // Default. Operationally useful: who is up, then who has earned most.
    status:(a,b)=>(ST_ORDER[a.status]-ST_ORDER[b.status]) || (b.xp-a.xp),
    name:  (a,b)=>a.name.localeCompare(b.name)*-dir,
    xp:    (a,b)=>(num(a.xp)-num(b.xp))*dir,
    sorties:(a,b)=>(num(a.cb&&a.cb.sorties)-num(b.cb&&b.cb.sorties))*dir,
    kills: (a,b)=>(num(a.kd&&a.kd.kills)-num(b.kd&&b.kd.kills))*dir,
    flown: (a,b)=>(num(a.minutes)-num(b.minutes))*dir,
    last:  (a,b)=>(num(a.last)-num(b.last))*dir,
  };
  return recs.slice().sort(by[pSort]||by.status);
}

}

function pAvatar(r,cls){

    ${ring?`style="--ringc:${ring}"`:''}>${braidSvg(rk.braid,rk.stars)}</span>`;

function renderPilotsKpi(recs,c){

  const mins=recs.reduce((a,r)=>a+(r.minutes||0),0);

function renderReadiness(recs,c){

  const key=(cls,col,label,note,n)=>`<div><i style="background:${col}"></i>

function renderActiveFlightLine(recs){
  const live=recs.filter(r=>r.status!=='standby')
                 .sort((a,b)=>ST_ORDER[a.status]-ST_ORDER[b.status]);
  const el=$('#pFlight');
  if(!live.length){
    // The honest empty state: say what would appear, and what is true now.
    const st=D.status, on=st&&st.online&&(Date.now()/1000-st.ts)<STALE;
    el.innerHTML=`<div class="empty"><b>No pilots connected</b>
      ${on?'The server is up and the field is clear. Pilots appear here the moment they join.'
          :'The server is offline. Start it from Discord with <b>/dcs start</b>.'}</div>`;
    return;
  }
  const f=(k,v)=>`<div class="f"><span class="fk">${k}</span><span class="fv">${v}</span></div>`;
  el.innerHTML=live.map(r=>`
    <div class="flrow" data-n="${esc(r.name)}" tabindex="0" role="button"
         aria-label="Open record for ${esc(r.name)}">
      ${pAvatar(r,'')}
      <div style="min-width:0">
        <div class="cname">${esc(r.name)}</div>
        <div class="crole">${r.role?esc(r.role.tag):(r.side===1?'Red':r.side===2?'Blue':'Unassigned')}</div>
      </div>
      ${f('Status', ST_LABEL[r.status])}
      ${f('Aircraft', r.unit?esc(r.unit):'&mdash;')}
      ${f('Altitude', r.airborne?`${Math.round(r.alt).toLocaleString()} m`:'&mdash;')}
      ${stPip(r)}
    </div>`).join('');
}

function renderPilotRoster(recs){
  const view=sortPilots(filterPilots(recs));
  $('#pCount').textContent=`${view.length} of ${recs.length}`;

  if(!view.length){
    $('#pRoster').innerHTML=`<div class="empty"><b>No matching pilots</b>
      Nothing matches ${pQuery?`&ldquo;${esc(pQuery)}&rdquo;`:'this filter'}. Clear it to see the full roster.</div>`;
    return;
  }

  const th=(key,label,cls='')=>{
    const act=pSort===key;
    return `<th class="s ${cls} ${act?'act':''}" data-s="${key}" tabindex="0" role="button"
      aria-sort="${act?(pDesc?'descending':'ascending'):'none'}">${label}<span class="ar">${
      act?(pDesc?'\u25be':'\u25b4'):'\u25be'}</span></th>`;
  };

  $('#pRoster').innerHTML=`
    <table class="lb"><thead><tr>
      <th style="width:46px"></th>
      ${th('name','Pilot')}
      ${th('status','Status','hide-s')}
      <th class="hide-s">Rank</th>
      <th class="hide-s">Aircraft</th>
      ${th('sorties','Sorties','r n hide-s')}
      ${th('kills','Kills','r n')}
      ${th('flown','Flight time','r w hide-s')}
      ${th('last','Last active','r n hide-s')}
      ${th('xp','XP','r n')}
    </tr></thead><tbody>
    ${view.map((r,i)=>`
      <tr class="pr ${pSel===r.name?'sel':''}" data-n="${esc(r.name)}" tabindex="0"
          role="button" aria-label="Open record for ${esc(r.name)}">
        <td class="pos">${i+1}</td>
        <td><div class="cs">${pAvatar(r,'')}
          <span class="nmw">${esc(r.name)}</span>
          ${r.role?`<span class="badge role">${esc(r.role.tag)}</span>`:''}
          ${!r.role&&r.cmd?`<span class="badge cmd">CMD</span>`:''}
        </div></td>
        <td class="hide-s">${stPip(r)}</td>
        <td class="rk hide-s">${esc(rankOf(r.xp).ab)}</td>
        <td class="hide-s">${r.unit?`<span class="pill2">${esc(r.unit)}</span>`
          :'<span style="color:var(--ink-3)">&mdash;</span>'}</td>
        <td class="r n hide-s">${r.cb?(r.cb.sorties||0):'&mdash;'}</td>
        <td class="r n">${r.kd&&r.kd.kills?r.kd.kills:'&mdash;'}</td>
        <td class="r w hide-s">${r.minutes>=1?flown(r.minutes):'&mdash;'}</td>
        <td class="r n hide-s">${r.last?ago(Date.now()/1000-r.last):'&mdash;'}</td>
        <td class="r n" style="color:var(--ink)">${r.xp.toLocaleString()}</td>
      </tr>`).join('')}
    </tbody></table>`;

  $('#pRoster').querySelectorAll('th.s').forEach(h=>{
    const go=()=>setPilotView({sort:h.dataset.s});
    h.onclick=go;
    h.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } };
  });
  bindPilotOpen($('#pRoster'));
}

function bindPilotOpen(root){
  root.querySelectorAll('[data-n]').forEach(node=>{
    const go=()=>openPilot(node.dataset.n);
    node.onclick=go;
    node.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } };
  });
}

// --- intelligence drawer -----------------------------------------------------

function pilotActivity(name){
  // The event feed stores rendered sentences, so a pilot's history is the
  // subset that names them. Crude, but it is real data rather than invented.
  const n=name.toLowerCase();
  return ((D.feed&&D.feed.feed)||[]).filter(e=>String(e.t||'').toLowerCase().includes(n));
}

function renderPilotDetail(name){
  const recs=pilotRecords();
  const r=recs.find(x=>x.name===name);
  const dw=$('#pdrawer');
  if(!r){ dw.innerHTML=''; return; }

  const rk=rankOf(r.xp);
  const cb=r.cb, kd=r.kd;

  const tile=(v,l)=>`<div><b>${v}</b><span>${l}</span></div>`;
  const kv=(k,v)=>`<div class="dw-kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;

  // Only tiles with a real number behind them.
  const tiles=[tile(r.xp.toLocaleString(),'XP')];
  if(cb) tiles.push(tile(cb.sorties||0,'Sorties'), tile(cb.deaths||0,'Losses'));
  if(kd&&kd.kills) tiles.push(tile(kd.kills,'Kills'));
  if(kd&&kd.traps) tiles.push(tile(kd.traps,'Traps'));
  if(r.minutes>=1) tiles.push(tile(flown(r.minutes),'Flight time'));
  if(r.sessions) tiles.push(tile(r.sessions,'Sessions'));

  const facts=[];
  if(r.unit) facts.push(kv('Aircraft',esc(r.unit)));
  if(r.airborne) facts.push(kv('Altitude',Math.round(r.alt).toLocaleString()+' m'));
  if(r.on) facts.push(kv('Coalition',r.side===1?'Red':r.side===2?'Blue':'Unassigned'));
  if(cb&&cb.sorties) facts.push(kv('Returned',`${cb.landings||0} of ${cb.sorties} sorties`));
  if(cb&&(cb.shots||cb.hits)) facts.push(kv('Weapons',
    `${(cb.shots||0).toLocaleString()} released \u00b7 ${(cb.hits||0).toLocaleString()} impacts`));
  if(cb&&cb.ejects) facts.push(kv('Ejections',cb.ejects));
  if(rk.next) facts.push(kv('Next rank',
    `${rk.next.name} at ${rk.next.xp.toLocaleString()} XP \u00b7 ${rk.toNext.toLocaleString()} to go`));
  if(r.sb) facts.push(kv('Survival bonus',r.sb));
  if(r.cmd) facts.push(kv('Command actions',r.cmd));
  if(r.first) facts.push(kv('First seen',new Date(r.first*1000).toLocaleDateString()));
  if(r.last&&!r.on) facts.push(kv('Last seen',ago(Date.now()/1000-r.last)+' ago'));
  if(r.cfg&&r.cfg.gci_warning_radius!==undefined)
    facts.push(kv('GCI warning radius',`${r.cfg.gci_warning_radius} ${r.cfg.gci_metric?'km':'nm'}`));

  const acts=pilotActivity(name);

  dw.innerHTML=`
    <div class="dw-top">
      <span class="eyebrow">Pilot intelligence</span>
      <button class="dw-x" id="pdClose" aria-label="Close">&times;</button>
    </div>

    <div class="dw-id">
      <span class="av" title="${esc(rk.name)}">${braidSvg(rk.braid,rk.stars)}</span>
      <div style="min-width:0">
        <div class="nm">${esc(r.name)}</div>
        <div class="rk">${esc(rk.name)}</div>
        ${r.role?`<div class="rl"><span class="badge role">${esc(r.role.tag)}</span></div>
                  <div class="pnote" style="margin-top:7px">${esc(r.role.title)}</div>`:''}
        <div class="stline">${stPip(r)}</div>
      </div>
    </div>

    <div class="dw-sec">
      <h4>Record</h4>
      <div class="dw-grid">${tiles.join('')}</div>
    </div>

    ${facts.length?`<div class="dw-sec"><h4>Detail</h4>${facts.join('')}</div>`:''}

    <div class="dw-sec">
      <h4>Activity</h4>
      ${acts.length
        ? `<div class="dw-tl">${acts.slice(0,14).map(e=>`
            <div class="ev ${esc(e.k)}">
              <div class="t">${ago(Date.now()/1000-e.ts)} ago &middot; ${esc(String(e.k).toUpperCase())}</div>
              <div class="x">${esc(e.t)}</div>
            </div>`).join('')}</div>`
        : `<div class="dw-empty">No events recorded for this pilot. Kills, captures,
           traps and connections are logged live while the server runs.</div>`}
    </div>`;

  $('#pdClose').onclick=closePilot;
}

function openPilot(name){
  pSel=name;
  $('#panel').classList.add('drawered');
  renderPilotDetail(name);
  $('#pdrawer').classList.add('open');
  $('#pdrawer').setAttribute('aria-hidden','false');
  $('#pscrim').classList.add('on');
  $('#pscrim').hidden=false;
  $('#pRoster').querySelectorAll('tr.pr').forEach(t=>
    t.classList.toggle('sel', t.dataset.n===name));
}

function closePilot(){
  pSel=null;
  $('#panel').classList.remove('drawered');
  $('#pdrawer').classList.remove('open');
  $('#pdrawer').setAttribute('aria-hidden','true');
  $('#pscrim').classList.remove('on');
  $('#pscrim').hidden=true;
  $('#pRoster').querySelectorAll('tr.pr.sel').forEach(t=>t.classList.remove('sel'));
}

function renderPilots(){
  const recs=pilotRecords();

  if(!recs.length){
    pShell=false;
    $('#panel').innerHTML=`<div class="pops"><div class="pop-head"><div>
      <h2>Pilot operations</h2>
      <div class="sub">Squadron personnel and flight status.</div></div></div>
      <div class="empty" style="margin-top:20px"><b>No roster yet</b>
      Pretense writes pilot records the first time someone flies. Nothing has been
      logged on this campaign.</div></div>`;
    return;
  }

  // Build the frame once. Rebuilding it every poll would clear the search box
  // mid-keystroke and lose the caret.
  if(!pShell){
    $('#panel').innerHTML=`<div class="pops">
      <div class="pop-head">
        <div>
          <h2>Pilot operations</h2>
          <div class="sub">Squadron personnel and flight status. Select a pilot for the full record.</div>
        </div>
        <div class="pop-ctx" id="pCtx"></div>
      </div>
      <div class="kpi" id="pKpi"></div>

      <div class="pband">
        <div>
          <div class="srule"><span>Active flight line</span><i></i></div>
          <div class="fl" id="pFlight"></div>
        </div>
        <div>
          <div class="srule"><span>Readiness</span><i></i></div>
          <div class="rd" id="pReady"></div>
        </div>
      </div>

      <div class="srule"><span>Personnel roster</span><i></i></div>
      <div class="rct">
        <label class="psearch">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/>
            <path d="M10.5 10.5 L14 14"/></svg>
          <input id="pQ" type="search" placeholder="SEARCH PILOT..."
                 aria-label="Search pilots" autocomplete="off">
        </label>
        <div class="pfilt" id="pF" role="group" aria-label="Filter roster">
          <button data-f="all" class="on">ALL</button>
          <button data-f="connected">CONNECTED</button>
          <button data-f="airborne">AIRBORNE</button>
          <button data-f="command">COMMAND</button>
        </div>
        <span class="count" id="pCount"></span>
      </div>
      <div id="pRoster"></div>
    </div>`;

    const q=$('#pQ');
    q.value=pQuery;
    q.oninput=()=>setPilotView({q:q.value});
    $('#pF').querySelectorAll('button').forEach(b=>b.onclick=()=>{
      $('#pF').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
      setPilotView({filter:b.dataset.f});
    });
    pShell=true;
  }

  const c=pilotCounts(recs);
  const st=D.status, age=st?Date.now()/1000-st.ts:1e9;
  const on=st&&st.online&&age<STALE;

  $('#pCtx').innerHTML=`
    <div><span class="k">Theatre</span>${esc((D.zones&&D.zones.theatre)||'Caucasus')}</div>
    <div><span class="k">Feed</span><span class="${on?'live':'dead'}">${on?'LIVE':'OFFLINE'}</span></div>
    <div><span class="k">Synced</span>${st?ago(age):'--'}</div>
    <div><span class="k">Roster</span>${c.total}</div>`;

  renderPilotsKpi(recs,c);
  renderReadiness(recs,c);
  renderActiveFlightLine(recs);
  bindPilotOpen($('#pFlight'));
  renderPilotRoster(recs);
  if(pSel) renderPilotDetail(pSel);
}

// --- Campaign history -------------------------------------------------------
//
// history.json is sampled by the publisher on the box, because Pretense only
// ever writes CURRENT state -- yesterday's front line is gone the moment it
// saves. Points land every 10 minutes, or immediately when a zone flips.

function renderHistory(){
  const h=(D.history||[]).filter(p=>p&&p.t&&(p.b+p.r)>0);
  const feed=(D.feed&&D.feed.feed)||[];

  const chart = h.length<2
    ? `<div class="empty"><b>Not enough history</b>The front line is sampled every
       10 minutes while the server runs.${h.length?' One sample so far.':''}</div>`
    : (()=>{
        const W=1000,H=200,PAD=4;
        const t0=h[0].t,t1=h[h.length-1].t,span=Math.max(1,t1-t0);
        const x=p=>((p.t-t0)/span)*W;
        const maxZ=Math.max(...h.map(p=>p.b+p.r),1);
        const yy=v=>H-PAD-(v/maxZ)*(H-PAD*2);
        const line=h.map((p,i)=>`${i?'L':'M'}${x(p).toFixed(1)},${yy(p.b).toFixed(1)}`).join('');
        const area=`${line}L${W},${H}L0,${H}Z`;
        const rline=h.map((p,i)=>`${i?'L':'M'}${x(p).toFixed(1)},${yy(p.r).toFixed(1)}`).join('');
        const first=h[0],last=h[h.length-1],delta=last.b-first.b;
        const dtxt=delta>0?`+${delta} zones to blue`:delta<0?`${delta} zones to blue`:'no net change';
        return `<div class="sub">${h.length} samples over ${ago(t1-t0)} &middot;
            <b>${dtxt}</b> in that window.</div>
          <div class="tlk">
            <span><i style="background:var(--blue)"></i>Blue held</span>
            <span><i style="background:var(--rose)"></i>Red held</span>
          </div>
          <div class="tlwrap">
            <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
                 aria-label="Zones held over time">
              <path d="${area}" fill="var(--blue)" opacity=".13"/>
              <path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2"
                    vector-effect="non-scaling-stroke"/>
              <path d="${rline}" fill="none" stroke="var(--rose)" stroke-width="2"
                    stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>
            </svg>
            <div class="tlx">
              <span>${new Date(t0*1000).toLocaleString()}</span>
              <span>${last.b} blue &middot; ${last.r} red</span>
              <span>${new Date(t1*1000).toLocaleString()}</span>
            </div>
          </div>`;
      })();

  const log = feed.length
    ? `<div class="log">${feed.slice(0,50).map(e=>`<div class="le ${esc(e.k)}">
         <span class="lt">${ago(Date.now()/1000-e.ts)}</span>
         <span class="lk">${esc(String(e.k).toUpperCase())}</span>
         <span class="lx">${esc(e.t)}</span></div>`).join('')}</div>`
    : `<div class="empty"><b>No events recorded</b>Kills, zone captures, carrier
       traps and connections appear here as they happen. The stream starts when
       the server does.</div>`;

  $('#panel').innerHTML=`<div class="pnl wide">
    <h2>Operations log</h2>
    <div class="srule"><span>Front line</span><i></i></div>
    ${chart}
    <div class="srule"><span>Events</span><i></i></div>
    ${log}
  </div>`;
}

// --- Files ------------------------------------------------------------------

// that does not match the server.
//
// The VERSIONS are the load-bearing part of this page. A mod aircraft only
// appears in the dynamic-spawn list if the client has the same build the
// server does, and the failure mode is a silently missing airframe.

  {n:'Su-30MKI "Flanker Ex"', v:'Su-30_EFM_V2.8.06b', src:'',

  {n:'Hercules',             v:'6.8.2',        src:'',
   d:'Anubis C-130J. Install to Saved Games\\DCS\\Mods\\aircraft\\.'},
  {n:'UH-60L Black Hawk',    v:'2.1.5',        src:'',
   d:'Kinkku. Also gives you UH-60L_DAP and the KC-130J tanker. Its Scripts\\Hooks\\bhHook.lua goes in YOUR Saved Games (it drives the door gunners) — it is deliberately not on the server.'}

    <div class="req"><b>Versions must match exactly.</b>

    <div class="srule"><span>Required packages</span><i></i></div>

          : '<span class="ask">Ask in Discord<br>for the link</span>'}</div>

// Zone dots for the background watermark, in a normalised 1000-wide box.
// Returns null when the campaign has not loaded, so the caller can leave the
// backdrop empty rather than draw a guess.
function ghostPoints(){
  const zpos=(D.zones&&D.zones.zones)||{}, c=D.campaign;
  if(!c||!c.zones) return null;
  const raw=[];
  Object.values(c.zones).forEach(z=>{
    const ll=zpos[z.name];
    if(!Array.isArray(ll)) return;
    raw.push({lat:ll[0], lon:ll[1], side:z.side, front:(z.distToFront??9)<=1});
  });
  if(raw.length<3) return null;
  // Equirectangular about the theatre's own mean latitude, which is what keeps
  // it from looking stretched east-west. Scaling each point by its own
  // cos(lat) instead shears the map: only 4% across the Caucasus, but it makes
  // the aspect ratio depend on where the zones happen to sit, which is how a
  // north-south theatre ends up several times too tall.
  const lat0=raw.reduce((s,p)=>s+p.lat,0)/raw.length;
  const k=Math.cos(lat0*Math.PI/180);
  const proj=raw.map(p=>({x:p.lon*k, y:-p.lat, side:p.side, front:p.front}));
  const xs=proj.map(p=>p.x), ys=proj.map(p=>p.y);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const y0=Math.min(...ys), y1=Math.max(...ys);
  const sx=x1-x0||1, sy=y1-y0||1;
  const h=Math.round(1000*sy/sx);
  return {h, pts:proj.map(p=>({
    x:+(((p.x-x0)/sx)*1000).toFixed(1),
    y:+(((p.y-y0)/sy)*h).toFixed(1),
    side:p.side, front:p.front}))};
}

function renderGhost(){
  const host=$('#ghost'); if(!host) return;
  const g=ghostPoints();
  if(!g){ host.innerHTML=''; return; }
  // A geographic viewBox lets the browser scale this on resize, which is why
  // there is no resize handler here.
  const A={0:.085, 1:.075, 2:.10};   // red reads hotter than blue at equal alpha
  const dots=g.pts.map(p=>
    `<circle cx="${p.x}" cy="${p.y}" r="${p.front?11:7}" fill="${SIDE[p.side]}" `+
    `fill-opacity="${(A[p.side]??.085)+(p.front?.045:0)}"/>`).join('');
  host.innerHTML=
    `<svg viewBox="-14 -14 1028 ${g.h+28}" preserveAspectRatio="xMidYMax meet" `+
    `aria-hidden="true">${dots}</svg>`;
}

const PANELS={pilots:renderPilots, history:renderHistory, files:renderFiles};

function draw(){
  renderHeader();
  syncHeaderHeight();
  const isList=view==='list', isPanel=!!PANELS[view], isMap=!isList&&!isPanel;

  // Map draws its own world; the substrate would only sit under tiles.
  $('#bg').style.display    = isMap  ?'none' :'block';
  // Ops runs its columns to both edges; the margin apparatus belongs to the
  // three centred document pages.
  $('#bg').classList.toggle('doc', isPanel);
  if(!isMap) renderGhost();

  $('#list').style.display  = isList ?'grid' :'none';
  $('#map').style.display   = isMap  ?'block':'none';
  $('#panel').style.display = isPanel?'block':'none';

  // The whole filter bar belongs to Ops. Leaving an empty strip on Map or
  // Pilots was 38px of chrome that answered nothing.
  $('#filters').style.display = isList?'flex':'none';

  $('#hud').style.display      = isMap?'grid':'none';
  $('#hud').setAttribute('aria-hidden', isMap?'false':'true');
  $('#gci').style.display      = (isMap&&intel)?'block':'none';
  $('#hud').classList.toggle('panelled', isMap&&intel);
  $('#intel').classList.toggle('on', intel);
  $('#intel').setAttribute('aria-pressed', intel?'true':'false');

  // The drawer floats above every view, so it has to go when the view does.
  if(view!=='pilots' && pSel) closePilot();
  // Rebuild the pilots shell on re-entry so stale nodes are never reused.
  if(view!=='pilots') pShell=false;

  if(isList) renderList();
  else if(isPanel) PANELS[view]();
  else { map.invalidateSize(); renderMap(intel); mapNote(); renderHud();
         if(intel) renderGci(); }
}

$('#views').querySelectorAll('.sb').forEach(b=>b.onclick=()=>{
  view=b.dataset.v;
  $('#views').querySelectorAll('.sb').forEach(x=>{
    const on = x===b;
    x.classList.toggle('on',on);
    x.setAttribute('aria-selected', on?'true':'false');
  });
  draw();
});

$('#pscrim').onclick=closePilot;
addEventListener('keydown',e=>{ if(e.key==='Escape' && pSel) closePilot(); });

$('#intel').onclick=()=>{
  intel=!intel;
  try { localStorage.setItem('sf-intel', intel?'1':'0'); } catch(e) {}
  // The map's usable width changes when the panel appears, so Leaflet has to
  // be told before anything is redrawn against the new size.
  map.invalidateSize();
  draw();
};

async function tick(){
  const [st,cp,lv,pl,hs,sn]=await Promise.all([
    grab('status.json'),grab('campaign.json'),grab('live.json'),
    grab('pilots.json'),grab('history.json'),grab('pilots-seen.json')]);
  if(!D.zones) D.zones = await grab('zones.json');
  const cb = await grab('combat.json'); if(cb) D.combat = cb;
  const kd = await grab('combat-events.json'); if(kd) D.kd = kd;
  const fd = await grab('events.json'); if(fd) D.feed = fd;
  D.status=st; D.campaign=cp;
  // Keep the last good copy: a 403 while the server is asleep should not blank
  // a leaderboard that is perfectly valid history.
  if(pl) D.pilots=pl;
  if(sn) D.seen=sn;
  if(Array.isArray(hs)) D.history=hs;
  // Live data outlives the server by design; ignore it once stale or the map
  // shows aircraft frozen in mid-air from days ago.
  D.live = lv && (Date.now()/1000-lv.ts)<STALE ? lv : null;
  draw();
  $('#upd').textContent='updated '+new Date().toLocaleTimeString();
}
renderCats(); syncHeaderHeight(); tick(); setInterval(tick,POLL);

// ResizeObserver catches wraps caused by width changes AND by content changes;
// the resize listener is the fallback for browsers without it.
if(typeof ResizeObserver !== 'undefined' && $('#hdr')){
  new ResizeObserver(syncHeaderHeight).observe($('#hdr'));
} else if(typeof addEventListener === 'function'){
  addEventListener('resize', syncHeaderHeight);
}
</script>
